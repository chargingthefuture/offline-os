<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Gem Match</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#16171b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gem Match">

  <link rel="apple-touch-icon" href="../../shared/icons/icon-180.png">
  <link rel="icon" href="../../shared/icons/icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="../../shared/fonts.css">
  <link rel="stylesheet" href="../../shared/theme.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg, #16171b);
    }

    body {
      padding:
        max(10px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .game {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    .back {
      display: inline-block;
      padding: 5px 0;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      color: var(--amber);
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 7vw, 36px);
      line-height: 1;
    }

    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .scores {
      display: flex;
      flex-shrink: 0;
      gap: 5px;
    }

    .score {
      min-width: 58px;
      padding: 5px 6px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .score .k {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .score .v {
      color: var(--amber);
      font-family: "Barlow Semi Condensed", "Inter", sans-serif;
      font-size: clamp(18px, 5vw, 23px);
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .goal {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .goal .need {
      color: var(--text);
    }

    .track {
      height: 7px;
      margin-top: 5px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 99px;
    }

    .track .bar {
      width: 0;
      height: 100%;
      background: var(--amber);
      border-radius: 99px;
      transition: width .25s ease;
    }

    .boardwrap {
      position: relative;
      width: min(94vw, 580px);
      margin: 14px auto 12px;
    }

    .board {
      display: grid;
      width: 100%;
      aspect-ratio: 1;
      gap: clamp(3px, .9vw, 6px);
      padding: clamp(4px, 1.5vw, 8px);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: clamp(10px, 3vw, 16px);
      touch-action: manipulation;
      user-select: none;
    }

    .gem {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  contain: strict;
  border-radius: clamp(5px, 1.8vw, 11px);
  color: rgba(255, 255, 255, .95);
  cursor: pointer;
  font-family: Arial, sans-serif;
  font-size: clamp(17px, 5vw, 31px);
  line-height: 1;
  white-space: nowrap;
  text-shadow:
    0 1px 2px rgba(0, 0, 0, .7),
    0 0 4px rgba(0, 0, 0, .4);
  transition:
    transform .08s ease,
    filter .12s ease,
    box-shadow .12s ease;
}

    .gem:active {
      transform: scale(.87);
    }

    .gem.sel {
      outline: 3px solid rgba(22, 23, 27, .85);
      outline-offset: -3px;
      filter: saturate(1.4);
      box-shadow:
        0 0 0 2px rgba(255, 255, 255, .9),
        0 0 14px rgba(255, 255, 255, .45);
    }

    .gem.special {
      box-shadow:
        inset 0 0 0 2px rgba(22, 23, 27, .45),
        0 0 8px rgba(255, 255, 255, .35);
    }

    .gem.clear {
      animation: pop .22s ease;
    }

    @keyframes pop {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      60% {
        transform: scale(.3);
        opacity: .25;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .notice {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity .18s ease;
    }

    .notice.on {
      opacity: 1;
    }

    .notice span {
      max-width: 86%;
      padding: 11px 18px;
      color: var(--amber);
      text-align: center;
      font-family: "Barlow Semi Condensed", "Inter", sans-serif;
      font-size: clamp(18px, 5vw, 24px);
      font-weight: 700;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .45);
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }

    .btn {
      min-height: 44px;
      padding: 9px 18px;
      font-size: 15px;
      touch-action: manipulation;
    }

    .hint {
      margin-top: 8px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    @media (max-width: 430px) {
      .header {
        display: block;
      }

      .scores {
        justify-content: space-between;
        width: 100%;
        margin-top: 12px;
      }

      .score {
        flex: 1;
      }

      .boardwrap {
        width: min(96vw, 580px);
        margin-top: 12px;
      }
    }

    @media (min-width: 431px) {
      .controls {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <a class="back" href="../../" id="backOS">&lsaquo; OS</a>

    <div class="header">
      <div>
        <h1>Gem Match</h1>
        <p class="sub" id="sub">Swap to match three or more</p>
      </div>

      <div class="scores">
        <div class="score">
          <div class="k">Level</div>
          <div class="v" id="level">1</div>
        </div>

        <div class="score">
          <div class="k">Score</div>
          <div class="v" id="score">0</div>
        </div>

        <div class="score">
          <div class="k">Best</div>
          <div class="v" id="best">0</div>
        </div>
      </div>
    </div>

    <div class="goal">
      <div id="rule" class="need">Match 3 or more</div>
      <div id="progress">0 / 900</div>
    </div>

    <div class="track">
      <div class="bar" id="bar"></div>
    </div>

    <div class="boardwrap">
      <div class="board" id="board"></div>

      <div class="notice" id="notice">
        <span id="noticeText"></span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="newGameButton">New game</button>
    </div>

    <div class="hint" id="hint">
      Match 3 normally. Match 4+ to create a special gem.
    </div>
  </main>

  <script src="../../shared/storage.js"></script>
  <script src="../../shared/pwa.js"></script>

  <script>
    registerPWA("sw.js");

    (function() {
      var back = document.getElementById("backOS");

      if (back) {
        var match = location.pathname.match(/^(.*?\/)apps\//);

        if (match) {
          back.href = match[1];
        }
      }
    })();

    var SKEY = "game-gem-match";
    var N = 8;

    /*
      Spring pastels. Ordered so the five a new player sees (blossom, sky,
      leaf, butter, lilac) are the furthest apart; peach and seafoam only
      join at higher levels, where there are more colours to tell apart
      anyway.
    */
    var COLORS = [
      "#ff9fb2",
      "#7fd8f7",
      "#9fe6a0",
      "#ffe082",
      "#c9a7f0",
      "#ffc08a",
      "#8fe3d2"
    ];

    var EMOJI = {
      bomb: "💣",
      rainbow: "🌈",
      changer: "🌀",
      line: "⚡"
    };

    var LEVELS = [
      { need: 3, colors: 5, goal: 900 },
      { need: 3, colors: 6, goal: 2200 },
      { need: 3, colors: 7, goal: 4200 },
      { need: 4, colors: 5, goal: 7000 },
      { need: 4, colors: 6, goal: 10500 }
    ];

    var TAIL = 3500;

    var board = [];
    var score = 0;
    var best = 0;
    var level = 1;
    var selected = null;
    var busy = false;

    var boardEl = document.getElementById("board");

    boardEl.style.gridTemplateColumns = "repeat(" + N + ", 1fr)";

    function levelCfg(currentLevel) {
      if (currentLevel <= LEVELS.length) {
        return LEVELS[currentLevel - 1];
      }

      var last = LEVELS[LEVELS.length - 1];

      return {
        need: last.need,
        colors: last.colors,
        goal: last.goal + (currentLevel - LEVELS.length) * TAIL
      };
    }

    function need() {
      return levelCfg(level).need;
    }

    function goal() {
      return levelCfg(level).goal;
    }

    function floorScore() {
      return level > 1 ? levelCfg(level - 1).goal : 0;
    }

    function rc(row, col) {
      return row * N + col;
    }

    function rowOf(index) {
      return Math.floor(index / N);
    }

    function colOf(index) {
      return index % N;
    }

    function newGem(color, special) {
      return {
        color: color,
        special: special || null
      };
    }

    function delay(milliseconds) {
      return new Promise(function(resolve) {
        setTimeout(resolve, milliseconds);
      });
    }

    async function loadBest() {
      try {
        var result = await window.storage.get(SKEY);

        if (result && result.value) {
          best = JSON.parse(result.value).best || 0;
        }
      } catch (error) {
        best = 0;
      }

      document.getElementById("best").textContent = best;
    }

    async function saveBest() {
      if (score > best) {
        best = score;
        document.getElementById("best").textContent = best;

        try {
          await window.storage.set(
            SKEY,
            JSON.stringify({ best: best })
          );
        } catch (error) {
          // The game continues if storage is unavailable.
        }
      }
    }

    function showNotice(text) {
      document.getElementById("noticeText").textContent = text;
      document.getElementById("notice").classList.add("on");
    }

    function clearNotice() {
      document.getElementById("notice").classList.remove("on");
    }

    function paint() {
      var minimum = need();
      var low = floorScore();
      var high = goal();

      document.getElementById("level").textContent = level;
      document.getElementById("score").textContent = score;

      document.getElementById("sub").textContent =
        "Swap to match " + minimum + " or more";

      document.getElementById("rule").textContent =
        "Match " + minimum + "+ — 4+ creates a special";

      document.getElementById("hint").textContent =
        "Match " + minimum + " normally. Clearing 4+ gems in one match " +
        "creates a special, corners and crosses included -- five in a line, " +
        "or six round a corner, always makes a rainbow that takes a whole " +
        "colour. The swirl paints the block around it one colour so it " +
        "lines up. Swap a special with any neighbour to set it off -- that " +
        "counts as a move even when no colour lines up.";

      document.getElementById("progress").textContent =
        Math.min(score, high) + " / " + high;

      var percentage = Math.max(
        0,
        Math.min(1, (score - low) / (high - low))
      ) * 100;

      document.getElementById("bar").style.width =
        percentage.toFixed(1) + "%";
    }

    function getColor(row, col) {
      if (
        row < 0 ||
        row >= N ||
        col < 0 ||
        col >= N ||
        !board[row][col]
      ) {
        return -1;
      }

      return board[row][col].color;
    }

    function runLength(row, col, color, rowDirection, colDirection) {
      var length = 1;

      for (
        var r = row - rowDirection,
            c = col - colDirection;

        r >= 0 &&
        r < N &&
        c >= 0 &&
        c < N &&
        getColor(r, c) === color;

        r -= rowDirection,
        c -= colDirection
      ) {
        length++;
      }

      return length;
    }

    function makeBoard() {
      var minimum = need();
      var colorCount = levelCfg(level).colors;

      board = [];

      for (var r = 0; r < N; r++) {
        board.push([]);

        for (var c = 0; c < N; c++) {
          var color;

          do {
            color = Math.floor(Math.random() * colorCount);
          } while (
            runLength(r, c, color, 0, 1) >= minimum ||
            runLength(r, c, color, 1, 0) >= minimum
          );

          board[r].push(newGem(color));
        }
      }
    }

    function dealBoard() {
      for (var attempt = 0; attempt < 200; attempt++) {
        makeBoard();

        if (hasMove()) {
          return;
        }
      }

      makeBoard();
    }

    function getMatches() {
      var minimum = need();
      var matches = {};

      // Horizontal matches
      for (var r = 0; r < N; r++) {
        var run = 1;

        for (var c = 1; c <= N; c++) {
          if (
            c < N &&
            getColor(r, c) >= 0 &&
            getColor(r, c) === getColor(r, c - 1)
          ) {
            run++;
          } else {
            if (
              getColor(r, c - run) >= 0 &&
              run >= minimum
            ) {
              for (var x = 0; x < run; x++) {
                matches[rc(r, c - 1 - x)] = true;
              }
            }

            run = 1;
          }
        }
      }

      // Vertical matches
      for (var c2 = 0; c2 < N; c2++) {
        var run2 = 1;

        for (var r2 = 1; r2 <= N; r2++) {
          if (
            r2 < N &&
            getColor(r2, c2) >= 0 &&
            getColor(r2, c2) === getColor(r2 - 1, c2)
          ) {
            run2++;
          } else {
            if (
              getColor(r2 - run2, c2) >= 0 &&
              run2 >= minimum
            ) {
              for (var y = 0; y < run2; y++) {
                matches[rc(r2 - 1 - y, c2)] = true;
              }
            }

            run2 = 1;
          }
        }
      }

      return Object.keys(matches).map(Number);
    }

    function getRuns() {
      var minimum = need();
      var runs = [];

      // Horizontal runs
      for (var r = 0; r < N; r++) {
        var start = 0;

        for (var c = 1; c <= N; c++) {
          var same =
            c < N &&
            getColor(r, c) >= 0 &&
            getColor(r, c) === getColor(r, c - 1);

          if (!same) {
            var length = c - start;

            if (
              getColor(r, start) >= 0 &&
              length >= minimum
            ) {
              var cells = [];

              for (var x = start; x < c; x++) {
                cells.push(rc(r, x));
              }

              runs.push({
                cells: cells,
                color: getColor(r, start),
                length: length
              });
            }

            start = c;
          }
        }
      }

      // Vertical runs
      for (var c2 = 0; c2 < N; c2++) {
        var start2 = 0;

        for (var r2 = 1; r2 <= N; r2++) {
          var same2 =
            r2 < N &&
            getColor(r2, c2) >= 0 &&
            getColor(r2, c2) === getColor(r2 - 1, c2);

          if (!same2) {
            var length2 = r2 - start2;

            if (
              getColor(start2, c2) >= 0 &&
              length2 >= minimum
            ) {
              var cells2 = [];

              for (var y = start2; y < r2; y++) {
                cells2.push(rc(y, c2));
              }

              runs.push({
                cells: cells2,
                color: getColor(start2, c2),
                length: length2
              });
            }

            start2 = r2;
          }
        }
      }

      return runs;
    }

    function swapCells(a, b) {
      var temporary = board[a[0]][a[1]];

      board[a[0]][a[1]] = board[b[0]][b[1]];
      board[b[0]][b[1]] = temporary;
    }

    function clearsSomething(a, b) {
      swapCells(a, b);

      var works = getMatches().length > 0;

      swapCells(a, b);

      return works;
    }

    /*
      Swapping a special gem sets it off whether or not the swap lines up a
      colour run (see trySwap), so any special with a neighbour to trade
      places with is a playable move on its own.
    */
    function hasPlayableSpecial() {
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          var gem = board[r][c];

          if (!gem || !gem.special) {
            continue;
          }

          if (
            (r > 0 && board[r - 1][c]) ||
            (r < N - 1 && board[r + 1][c]) ||
            (c > 0 && board[r][c - 1]) ||
            (c < N - 1 && board[r][c + 1])
          ) {
            return true;
          }
        }
      }

      return false;
    }

    function hasMove() {
      if (hasPlayableSpecial()) {
        return true;
      }

      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          if (
            c + 1 < N &&
            clearsSomething([r, c], [r, c + 1])
          ) {
            return true;
          }

          if (
            r + 1 < N &&
            clearsSomething([r, c], [r + 1, c])
          ) {
            return true;
          }
        }
      }

      return false;
    }

    /*
      Runs of the same colour that share a cell are one match -- an L or a T,
      not two separate lines. Group them so a match can be judged by the gems
      it clears rather than by its longest arm alone, which is the only thing
      a straight-run reading can see.
    */
    function matchShapes(runs) {
      var parent = [];
      var i;

      for (i = 0; i < runs.length; i++) {
        parent.push(i);
      }

      function find(x) {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]];
          x = parent[x];
        }

        return x;
      }

      // Two runs that land on the same cell belong to the same shape.
      var owner = {};

      for (i = 0; i < runs.length; i++) {
        var cells = runs[i].cells;

        for (var c = 0; c < cells.length; c++) {
          if (owner[cells[c]] === undefined) {
            owner[cells[c]] = i;
          } else {
            var a = find(owner[cells[c]]);
            var b = find(i);

            if (a !== b) {
              parent[b] = a;
            }
          }
        }
      }

      var groups = {};

      for (i = 0; i < runs.length; i++) {
        var root = find(i);
        var run = runs[i];

        if (!groups[root]) {
          groups[root] = {
            color: run.color,
            seen: {},
            size: 0,
            longest: 0,
            cross: null,
            spine: run
          };
        }

        var group = groups[root];

        for (var d = 0; d < run.cells.length; d++) {
          var cell = run.cells[d];

          if (group.seen[cell]) {
            group.cross = cell;   // where the arms meet: the corner of the L
          } else {
            group.seen[cell] = true;
            group.size++;
          }
        }

        if (run.length > group.longest) {
          group.longest = run.length;
          group.spine = run;
        }
      }

      return Object.keys(groups).map(function(key) {
        var group = groups[key];

        return {
          color: group.color,
          size: group.size,
          longest: group.longest,
          // A corner shape leaves its special where the arms cross.
          center: group.cross !== null
            ? group.cross
            : group.spine.cells[
                Math.floor(group.spine.cells.length / 2)
              ]
        };
      });
    }

    /*
      A run of 5+ always yields the rainbow -- the one that clears a whole
      colour -- so the big match has a payoff worth aiming for. A run of 4
      has a small chance at one too, and mostly hands out the gems that
      actually clear something; the changer is the weakest of the set, so it
      shows up least.
    */
    function randomSpecial(size, longest) {
      /*
        A straight five earns the rainbow. A corner has to be bigger to earn
        it -- seven gems, two full arms -- because bending a match is easier
        than extending one in a line.
      */
      if (longest >= 5 || size >= 7) {
        return "rainbow";
      }

      var normal = [
        "bomb",
        "bomb",
        "line",
        "line",
        "rainbow",
        "changer"
      ];

      return normal[
        Math.floor(Math.random() * normal.length)
      ];
    }

    function adjacentColors(row, col) {
      var colors = [];

      if (row > 0 && getColor(row - 1, col) >= 0) {
        colors.push(getColor(row - 1, col));
      }

      if (row < N - 1 && getColor(row + 1, col) >= 0) {
        colors.push(getColor(row + 1, col));
      }

      if (col > 0 && getColor(row, col - 1) >= 0) {
        colors.push(getColor(row, col - 1));
      }

      if (col < N - 1 && getColor(row, col + 1) >= 0) {
        colors.push(getColor(row, col + 1));
      }

      return colors;
    }

    function activateSpecial(row, col, clearSet) {
      var gem = board[row][col];

      if (!gem || !gem.special) {
        return;
      }

      if (gem.special === "bomb") {
        for (var r = row - 1; r <= row + 1; r++) {
          for (var c = col - 1; c <= col + 1; c++) {
            if (r >= 0 && r < N && c >= 0 && c < N) {
              clearSet[rc(r, c)] = true;
            }
          }
        }
      }

      if (gem.special === "line") {
        for (var c2 = 0; c2 < N; c2++) {
          clearSet[rc(row, c2)] = true;
        }

        for (var r2 = 0; r2 < N; r2++) {
          clearSet[rc(r2, col)] = true;
        }
      }

      if (gem.special === "rainbow") {
        var colors = adjacentColors(row, col);

        if (colors.length) {
          var target =
            colors[Math.floor(Math.random() * colors.length)];

          for (var r3 = 0; r3 < N; r3++) {
            for (var c3 = 0; c3 < N; c3++) {
              if (getColor(r3, c3) === target) {
                clearSet[rc(r3, c3)] = true;
              }
            }
          }
        }
      }

      /*
        The swirl paints the block around it a single colour, which then
        lines up and clears. The block is as wide as the level's match
        requirement, so it always leaves a run long enough to count.
      */
      if (gem.special === "changer") {
        var side = Math.max(3, need());

        var top = Math.min(Math.max(row - Math.floor((side - 1) / 2), 0), N - side);
        var left = Math.min(Math.max(col - Math.floor((side - 1) / 2), 0), N - side);

        /*
          Paint it the colour the block already holds most of, so the swirl
          extends what is there rather than dropping in something arbitrary.
        */
        var tally = {};
        var target = -1;
        var bestCount = 0;

        for (var br = top; br < top + side; br++) {
          for (var bc = left; bc < left + side; bc++) {
            var near = getColor(br, bc);

            if (near < 0) {
              continue;
            }

            tally[near] = (tally[near] || 0) + 1;

            if (tally[near] > bestCount) {
              bestCount = tally[near];
              target = near;
            }
          }
        }

        if (target >= 0) {
          for (var pr = top; pr < top + side; pr++) {
            for (var pc = left; pc < left + side; pc++) {
              if (board[pr][pc]) {
                // Keep any special sitting in the block; only recolour it.
                board[pr][pc].color = target;
              }
            }
          }

          gem.special = null;
        }
      }
    }

    function activateSpecialsInSet(clearSet) {
      var activated = {};

      function activateAt(index) {
        if (activated[index]) {
          return;
        }

        activated[index] = true;

        var row = rowOf(index);
        var col = colOf(index);
        var gem = board[row][col];

        if (!gem || !gem.special) {
          return;
        }

        var before = Object.keys(clearSet).length;

        activateSpecial(row, col, clearSet);

        var after = Object.keys(clearSet).length;

        // Prevent endless activation loops
        if (after > before) {
          Object.keys(clearSet).forEach(function(newIndex) {
            var n = Number(newIndex);
            var nr = rowOf(n);
            var nc = colOf(n);

            if (
              board[nr][nc] &&
              board[nr][nc].special
            ) {
              activateAt(n);
            }
          });
        }
      }

      Object.keys(clearSet).forEach(function(index) {
        activateAt(Number(index));
      });
    }

    function collapse() {
      var colorCount = levelCfg(level).colors;

      for (var c = 0; c < N; c++) {
        var remaining = [];

        for (var r = N - 1; r >= 0; r--) {
          if (board[r][c]) {
            remaining.push(board[r][c]);
          }
        }

        for (var r2 = N - 1; r2 >= 0; r2--) {
          var index = N - 1 - r2;

          board[r2][c] =
            index < remaining.length
              ? remaining[index]
              : newGem(Math.floor(Math.random() * colorCount));
        }
      }
    }

    function matchPoints(length, chain) {
      var base;

      if (length === 3) {
        base = 30;
      } else if (length === 4) {
        base = 55;
      } else if (length === 5) {
        base = 85;
      } else {
        base = 100 + ((length - 5) * 15);
      }

      return base * Math.min(chain, 3);
    }

    function resolve() {
      var total = 0;
      var chain = 0;

      return new Promise(function(done) {
        function stepOnce() {
          var matches = getMatches();

          if (!matches.length) {
            if (total > 0) {
              score += total;
              paint();
              saveBest();
            }

            done(total > 0);
            return;
          }

          chain++;

          var runs = getRuns();
          var clearSet = {};
          var best = null;
          var points = 0;

          matches.forEach(function(index) {
            clearSet[index] = true;
          });

          runs.forEach(function(run) {
            points += matchPoints(run.length, chain);
          });

          // The biggest shape earns the special, counted in gems cleared, so
          // a corner pays like the straight line of the same size.
          matchShapes(runs).forEach(function(shape) {
            if (shape.size < 4) {
              return;
            }

            if (!best || shape.size > best.size) {
              best = shape;
            }
          });

          /*
            Preserve one gem from the biggest 4+ match and turn it
            into a special gem instead of clearing it.
          */
          if (best) {
            delete clearSet[best.center];

            var specialRow = rowOf(best.center);
            var specialCol = colOf(best.center);

            board[specialRow][specialCol] = newGem(
              best.color,
              randomSpecial(best.size, best.longest)
            );
          }

          activateSpecialsInSet(clearSet);

          var cleared = Object.keys(clearSet).map(Number);

          points += Math.max(
            0,
            cleared.length - matches.length
          ) * 3;

          total += Math.min(points, 500) * Math.min(chain, 3);

          cleared.forEach(function(index) {
            board[rowOf(index)][colOf(index)] = null;
          });

          render(cleared);

          setTimeout(function() {
            collapse();
            render();

            setTimeout(stepOnce, 120);
          }, 210);
        }

        stepOnce();
      });
    }

    async function settle() {
      while (score >= goal()) {
        level++;

        paint();
        showNotice(
          "Level " + level + " — match " + need() + "+"
        );

        dealBoard();
        render();

        await delay(850);

        clearNotice();
        await delay(180);
      }

      if (!hasMove()) {
        showNotice("No moves left — new board");

        await delay(800);

        dealBoard();
        render();

        await delay(400);

        clearNotice();
        await delay(180);
      }

      paint();
    }

    function adjacent(a, b) {
      return (
        Math.abs(a[0] - b[0]) +
        Math.abs(a[1] - b[1])
      ) === 1;
    }

    async function trySwap(a, b) {
      busy = true;

      var firstGem = board[a[0]][a[1]];
      var secondGem = board[b[0]][b[1]];

      swapCells(a, b);

      var swappedSpecial =
        (firstGem && firstGem.special) ||
        (secondGem && secondGem.special);

      if (swappedSpecial) {
        var effectSet = {};

        var firstAfter = board[a[0]][a[1]];
        var secondAfter = board[b[0]][b[1]];

        if (firstAfter && firstAfter.special) {
          effectSet[rc(a[0], a[1])] = true;
        }

        if (secondAfter && secondAfter.special) {
          effectSet[rc(b[0], b[1])] = true;
        }

        activateSpecialsInSet(effectSet);

        Object.keys(effectSet).forEach(function(index) {
          var number = Number(index);
          board[rowOf(number)][colOf(number)] = null;
        });

        var activated = Object.keys(effectSet).map(Number);

        /*
          A special set off by a swap clears its gems outside resolve(), so
          score them here -- otherwise a bomb could take out nine gems for
          nothing.
        */
        if (activated.length) {
          score += activated.length * 12;
          paint();
          saveBest();
        }

        render(activated);

        await delay(220);

        collapse();
        render();

        await delay(100);

        await resolve();
        await settle();
      } else if (getMatches().length) {
        render();

        await resolve();
        await settle();
      } else {
        render();

        await delay(130);

        swapCells(a, b);
        render();
      }

      busy = false;
    }

    function onCell(row, col) {
      if (busy) {
        return;
      }

      if (!selected) {
        selected = [row, col];
        render();
        return;
      }

      if (
        selected[0] === row &&
        selected[1] === col
      ) {
        selected = null;
        render();
        return;
      }

      if (adjacent(selected, [row, col])) {
        var first = selected;

        selected = null;

        trySwap(first, [row, col]);
      } else {
        selected = [row, col];
        render();
      }
    }

    function render(cleared) {
      cleared = cleared || [];

      boardEl.innerHTML = "";

      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          var gemData = board[r][c];
          var gem = document.createElement("div");

          gem.className = "gem";

          if (
            selected &&
            selected[0] === r &&
            selected[1] === c
          ) {
            gem.classList.add("sel");
          }

          if (
            gemData &&
            gemData.special
          ) {
            gem.classList.add("special");
          }

          if (cleared.indexOf(rc(r, c)) >= 0) {
            gem.classList.add("clear");
          }

          if (gemData) {
            gem.style.background = COLORS[gemData.color];
            gem.textContent =
              gemData.special
                ? EMOJI[gemData.special]
                : "";
          } else {
            gem.style.background = "transparent";
            gem.textContent = "";
          }

          (function(row, col) {
            gem.onclick = function() {
              onCell(row, col);
            };
          })(r, c);

          boardEl.appendChild(gem);
        }
      }
    }

    function newGame() {
      if (busy) {
        return;
      }

      score = 0;
      level = 1;
      selected = null;

      clearNotice();
      dealBoard();
      paint();
      render();
    }

    document
      .getElementById("newGameButton")
      .addEventListener("click", newGame);

    (async function() {
      await loadBest();
      newGame();
    })();
  </script>
</body>
</html>
