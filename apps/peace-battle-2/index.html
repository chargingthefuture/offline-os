<style>
  [hidden]{display:none!important;}
  .back{display:inline-block;color:var(--muted);text-decoration:none;font-size:13px;margin-bottom:2px;}
  .back:hover,.back:focus-visible{color:var(--amber);}

  .topline{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 6px;}
  .count{font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;font-size:30px;
    line-height:1;color:var(--amber);font-variant-numeric:tabular-nums;}
  .count small{display:block;font-family:inherit;font-weight:400;font-size:10.5px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}
  .counters{text-align:right;font-size:11px;color:var(--muted);line-height:1.7;white-space:nowrap;}
  .counters b{color:var(--text);font-variant-numeric:tabular-nums;}

  /* The card is the year. It sits above everything because it is what the year is about. */
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
    margin-bottom:10px;}
  .card.scheme{border-color:#5a3730;}
  .card .kind{font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;font-size:10px;
    text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:5px;}
  .card.scheme .kind{color:#c2664a;}
  .card h2{font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;font-size:17px;
    line-height:1.25;margin:0 0 7px;color:var(--text);}
  .card p{margin:0 0 7px;font-size:12px;line-height:1.7;color:var(--muted);}
  .card p:last-of-type{margin-bottom:10px;}
  .picks{display:grid;gap:7px;}
  .pick{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;font:inherit;color:var(--text);cursor:pointer;}
  .pick:hover,.pick:focus-visible{border-color:var(--amber);}
  .pick .pl{font-size:13px;font-weight:600;line-height:1.35;}
  .pick .pc{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .named{margin-top:9px;border-top:1px solid var(--line);padding-top:7px;}
  .named summary{font-size:10.5px;color:var(--muted);cursor:pointer;letter-spacing:.04em;}
  .named p{font-size:11px;margin:6px 0 0;}
  .named .nm{color:#c2664a;font-weight:600;}

  .places{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;
    -webkit-overflow-scrolling:touch;}
  .pbtn{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:6px 9px;font:inherit;color:var(--text);cursor:pointer;text-align:left;min-width:96px;}
  .pbtn[aria-pressed="true"]{border-color:var(--amber);background:var(--panel-2);}
  .pbtn .n{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:132px;}
  .pbtn .v{display:block;font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;
    font-size:15px;line-height:1.25;font-variant-numeric:tabular-nums;}
  .pbtn .st{display:block;font-size:10px;white-space:nowrap;}
  .pbtn .st.run{color:#57a87a;}
  .pbtn .st.stop{color:#e5794b;}
  .pbtn .st.gone{color:#a2412c;}
  .pbtn .st.held{color:#6f9fd8;}

  .rosterhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 0 4px;}
  .rosterhead{flex-wrap:wrap;}
  .rosterhead .t{font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;font-size:14px;
    text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
  .rosterhead .s{flex:1 1 100%;}
  .rosterhead .s{font-size:11px;color:var(--muted);}
  .roster{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px;
    margin-bottom:8px;}
  .job{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:baseline;width:100%;
    background:none;border:0;border-radius:6px;padding:5px;font:inherit;color:inherit;
    cursor:pointer;text-align:left;border-bottom:1px solid #22242a;}
  .job:last-child{border-bottom:0;}
  .job[aria-pressed="true"]{background:var(--panel-2);outline:1px solid var(--amber);}
  .job .jn{font-size:11.5px;color:var(--text);}
  .job .who{font-size:11px;color:var(--muted);text-align:right;}
  .job.thin .who{color:var(--amber);}
  .job.empty .jn{color:#8a8f99;}
  .job.empty .who{color:#e5794b;}
  .job .hint{display:block;font-size:9.5px;color:#7b8089;margin-top:1px;}

  .events{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    font-size:11.5px;line-height:1.65;color:var(--muted);margin-bottom:8px;min-height:38px;}
  .events b{color:var(--text);}
  .events .bad{color:#e5794b;}
  .events .good{color:#57a87a;}
  .events div{margin-bottom:2px;}
  .events div:last-child{margin-bottom:0;}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
  .act{background:var(--amber);border:1px solid var(--amber);border-radius:10px;color:#16171b;
    padding:11px 6px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;}
  .act.ghost{background:none;color:var(--text);border-color:var(--line);font-weight:400;}
  .act.wide{grid-column:1/3;}
  .act[disabled]{opacity:.4;cursor:default;}
  .act:focus-visible,.job:focus-visible,.pbtn:focus-visible,.reset:focus-visible,
  .pick:focus-visible,.seed input:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  .index{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px;}
  .ix{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;}
  .ix .n{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);line-height:1.4;}
  .ix .v{font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;font-size:17px;
    font-variant-numeric:tabular-nums;}

  svg.map{display:block;width:100%;height:auto;background:var(--panel-2);border:1px solid var(--line);
    border-radius:12px;margin-bottom:8px;touch-action:manipulation;}
  svg.map .link{stroke:#2c2f36;stroke-width:.7;}
  svg.map .link.live{stroke:#454b57;}
  svg.map text{font-family:'Barlow Semi Condensed','Inter',sans-serif;font-size:2.6px;fill:#8a8f99;
    text-anchor:middle;pointer-events:none;}
  svg.map .rg{font-size:2.9px;fill:#5f656f;letter-spacing:.08em;text-transform:uppercase;}
  svg.map .node{cursor:pointer;}
  svg.map .sel{fill:none;stroke:var(--amber);stroke-width:.7;stroke-dasharray:1.4 1.2;}

  .bars{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:10px;}
  .barrow{display:grid;grid-template-columns:1fr 46px;gap:6px;align-items:center;padding:3px 4px;}
  .barrow .nm{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .barrow .num{font-size:10.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;}
  .barrow .track{grid-column:1/3;height:4px;border-radius:3px;background:#2c2f36;overflow:hidden;}
  .barrow .fill{display:block;height:100%;background:var(--amber);}
  .barrow .fill.done{background:#2f6b4f;}

  .over{background:var(--panel-2);border:1px solid var(--amber);border-radius:12px;padding:12px 14px;
    margin-bottom:8px;}
  .over .t{font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;font-size:16px;
    text-transform:uppercase;letter-spacing:.05em;color:var(--amber);margin-bottom:4px;}
  .over p{margin:0 0 6px;font-size:12px;color:var(--muted);line-height:1.7;}

  .seed{display:flex;gap:6px;align-items:center;margin-bottom:8px;}
  .seed label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
  .seed input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:7px 9px;font:inherit;font-size:12px;font-variant-numeric:tabular-nums;}
  .seed button{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);
    padding:7px 10px;font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap;}
  .seed button:hover{color:var(--amber);border-color:var(--amber);}

  .reset{width:100%;background:none;border:1px solid var(--line);border-radius:10px;color:var(--muted);
    padding:9px 12px;font:inherit;font-size:12px;cursor:pointer;margin-bottom:14px;}

  details.about{border-top:1px solid var(--line);padding-top:10px;margin-bottom:10px;}
  details.about summary{font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;
    font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer;}
  details.about h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text);
    margin:12px 0 4px;}
  details.about p{font-size:11px;color:var(--muted);line-height:1.75;margin:0 0 8px;}
  .toggle{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin:8px 0 2px;}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>

// The opening six sit in their own region, which is the one the Directory reached. It bridges
// outward like any other, and "Outside the US and UK" is what those bridges leave from, because it
// is where the Directory already knows it has people it cannot place.
const OPENING_REGION = {
  key: 'reached',
  name: 'Where the Directory reached',
  x: 20,
  y: 52,
  bridges: ['north-america', 'west-europe', 'africa', 'south-america'],
};

const BRIDGE_HEAD = 'Outside the US and UK';

const SURVIVOR_POPULATION = 5_000_000;

// --- How a place opens ------------------------------------------------------------------------------
//
// One action, and the dice choose which place inside the region — which and when, never whether.
//
// A region opens before its places can be reached individually, which is what stops the board from
// unfolding as one long list. Reaching into a new region is the expensive move; the places inside it
// are cheaper once somebody is there, which is the same thing a link is for.
const OPENING_COST = {
  // A place opened has not been held yet, so it arrives already under pressure. This is what keeps
  // growth from being free: every place added is another thing that can be cut, and the isolation
  // spread below scales with how many are open.
  newPlaceIsolation: 1,
  // People who were already there and become findable once there is a way to reach them. Drawn from
  // the Directory's own histograms, like every other newcomer.
  peopleAtFirstReach: 4,
  // A region's first place costs more to open than its later ones, because somebody has to get there
  // at all before anybody can be found.
  firstInRegionExtra: 2,
};

function allPlaceNames() {
  return [...OPENING_PLACES, ...REGIONS.flatMap((r) => r.places.map((p) => p.name))];
}

function regionOf(placeName) {
  if (OPENING_PLACES.includes(placeName)) return OPENING_REGION.key;
  for (const region of REGIONS) {
    if (region.places.some((p) => p.name === placeName)) return region.key;
  }
  return null;
}

// Links form as places join: everything inside a region is connected to everything else inside it,
// and a region reaches the world through the bridges named above. So cutting a bridge isolates a
// region rather than a place, which is the cost of a network that spread thin.
function linksFor(placeName, openNames) {
  const region = regionOf(placeName);
  const open = new Set(openNames);
  const out = new Set();
  for (const other of open) {
    if (other === placeName) continue;
    if (regionOf(other) === region) out.add(other);
  }
  const bridges = region === OPENING_REGION.key
    ? OPENING_REGION.bridges
    : (REGIONS.find((r) => r.key === region)?.bridges ?? []);
  // A region's bridges land on whichever of its neighbours is open, at that neighbour's own bridge
  // head — the first place opened there. The opening region's bridge head is the bucket the
  // Directory could not place, which is the honest place for the world to start from.
  for (const neighbour of bridges) {
    const head = bridgeHeadOf(neighbour, openNames);
    if (head && head !== placeName) out.add(head);
  }
  // And back the other way, so a place opening inside a region the rest of the world already
  // bridges to does not sit unreachable.
  if (isBridgeHead(placeName, openNames)) {
    for (const other of open) {
      if (other === placeName) continue;
      const otherRegion = regionOf(other);
      if (otherRegion === region) continue;
      if (!isBridgeHead(other, openNames)) continue;
      const otherBridges = otherRegion === OPENING_REGION.key
        ? OPENING_REGION.bridges
        : (REGIONS.find((r) => r.key === otherRegion)?.bridges ?? []);
      if (otherBridges.includes(region)) out.add(other);
    }
  }
  return [...out];
}

// The first place opened in a region is what the rest of the world connects through.
function bridgeHeadOf(regionKey, openNames) {
  if (regionKey === OPENING_REGION.key) {
    return openNames.includes(BRIDGE_HEAD) ? BRIDGE_HEAD : null;
  }
  const region = REGIONS.find((r) => r.key === regionKey);
  if (!region) return null;
  for (const place of region.places) {
    if (openNames.includes(place.name)) return place.name;
  }
  return null;
}

function isBridgeHead(placeName, openNames) {
  return bridgeHeadOf(regionOf(placeName), openNames) === placeName;
}

// --- Apportioning the five million ------------------------------------------------------------------
//
// Display only. Nothing in the loop reads it: the index settles on findable people in running
// places, not on a headcount a place stands for. It exists so "reached" on screen is a figure rather
// than a count of pins.
//
// The opening six keep the relative sizes the generated board gave them, scaled so that everything
// on the world board sums to the five million.
function apportion(openingStandsFor) {
  const openingTotal = Object.values(openingStandsFor).reduce((a, b) => a + b, 0);
  const worldWeight = REGIONS.reduce((a, r) => a + r.places.reduce((b, p) => b + p.weight, 0), 0);
  // The Directory has reached a small part of the world, so the opening six are given a share of the
  // whole that matches how little of it they are: one weight point each per fifty thousand people
  // the generated board put behind them, which lands the six at a little under a tenth.
  const openingWeight = openingTotal / 50_000;
  const total = openingWeight + worldWeight;
  const out = {};
  for (const [name, standsFor] of Object.entries(openingStandsFor)) {
    const share = (standsFor / openingTotal) * openingWeight;
    out[name] = Math.round((share / total) * SURVIVOR_POPULATION);
  }
  for (const region of REGIONS) {
    for (const place of region.places) {
      out[place.name] = Math.round((place.weight / total) * SURVIVOR_POPULATION);
    }
  }
  return out;
}


// The event deck. Work item 3 of issue #47.

// --- What a scheme does here -----------------------------------------------------------------------
//
// Schemes act on coordination. A link stops working, a place stops being reachable, somebody stops
// being findable, a skill leaves the catalog with them. They never act on a character: no incidents,
// no harassment events, no raids, nothing done to a person shown on a screen.
//
// The slugs and labels below are the canonical ClickLog list, copied rather than invented, and only
// the ones whose real effect is on coordination are here. The bodily and personal ones are not in
// this deck and are not to be added to it.
//
// The label is never on the card face. It sits behind a disclosure — item 7 — because somebody
// should be able to play without reading the name of a method they have lived through, and because
// ClickLog's scheme tags mark real incidents and are evidence. The effect is what the card shows.

const pickOne = (rng, list) => list[Math.floor(rng() * list.length)];
const num = (n) => Math.round(n).toLocaleString('en-US');

// --- Reading the board for a card --------------------------------------------------------------------

function liveplaces(s) {
  return s.places.filter((p) => !p.cutOff);
}

function nameOf(s, resident) {
  return resident.name ?? resident.id;
}

function soleHolders(s, api) {
  const depth = api.skillDepth(s);
  const findable = api.findableResidents(s);
  const out = [];
  for (const [skillId, held] of depth) {
    if (held !== 1) continue;
    const holder = findable.find((r) => r.skills.has(skillId));
    if (holder) out.push({ skillId, holder, sector: skillId.split('#')[0] });
  }
  return out;
}

// --- The cards -----------------------------------------------------------------------------------
//
// Each one says when it can be drawn, and builds itself from the board. A choice carries the cost it
// will take, written out, because a decision whose price is invisible is not a decision.

function buildDeck(api) {
  const { findableResidents, skillDepth, teachingCapacity, placesThatRun, teamsMissingFor, components } = api;

  return [
    // --- Ordinary years ---------------------------------------------------------------------------
    {
      id: 'thick-and-thin',
      kind: 'ordinary',
      when: (s) => findableResidents(s).length > 20,
      build: (s) => {
        const findable = findableResidents(s);
        const sectors = Object.keys(s.skillsBySector);
        const scored = sectors.map((sector) => ({
          sector,
          teachers: findable.filter((r) => r.sectors[sector]).length,
          capacity: teachingCapacity(s, sector, findable),
          missing: api.missingInSector(s, sector, api.presentSkills(s)).length,
        })).filter((x) => x.missing > 0);
        if (scored.length < 2) return null;
        const thick = [...scored].sort((a, b) => b.capacity - a.capacity)[0];
        const thin = [...scored].sort((a, b) => a.teachers - b.teachers || b.missing - a.missing)[0];
        if (thick.sector === thin.sector) return null;
        const where = liveplaces(s).sort((a, b) => b.standsFor - a.standsFor)[0];
        return {
          title: 'Two sectors want teaching. One of them can hear you.',
          lines: [
            `${thick.sector} has ${thick.teachers} people doing it. Teach there and ${thick.capacity} learn `
              + `this year, against ${thick.missing} skills it is still short.`,
            `${thin.sector} has ${thin.teachers}. Teach there and ${thin.capacity} learn, against `
              + `${thin.missing} missing — and nobody with those skills walks in by chance, because that `
              + 'is how rare they are in the pool.',
          ],
          choices: [
            {
              key: 'thick',
              label: `Teach ${thick.sector}`,
              cost: `${thick.capacity} learn · ${thick.missing} short`,
              apply: (st) => { api.ACTIONS.teach(st, thick.sector, where.key); },
            },
            {
              key: 'thin',
              label: `Teach ${thin.sector}`,
              cost: `${thin.capacity} learn · ${thin.missing} short · only teaching reaches it`,
              apply: (st) => { api.ACTIONS.teach(st, thin.sector, where.key); },
            },
          ],
        };
      },
    },
    {
      id: 'rests-on-one',
      kind: 'ordinary',
      when: (s) => findableResidents(s).length > 10,
      build: (s) => {
        const sole = soleHolders(s, api);
        if (sole.length === 0) return null;
        const one = pickOne(s.rng, sole.slice(0, 12));
        const place = s.places.find((p) => p.key === one.holder.place);
        if (!place) return null;
        return {
          title: `${nameOf(s, one.holder)} is the only person holding a ${one.sector} skill.`,
          lines: [
            `${sole.length} of the skills on the board rest on one person each. The year any of those `
              + 'people is out of reach, the skill is off the catalog.',
            `Teaching the sector in ${place.key} puts somebody else behind it.`,

          choices: [

              label: `Teach ${one.sector} in ${place.key}`,
              cost: `${teachingCapacity(s, one.sector, findableResidents(s))} learn`,
              apply: (st) => { api.ACTIONS.teach(st, one.sector, place.key); },
            },

              key: 'look',

              cost: `${st1(s)} tried, some arrive`,

      id: 'somebody-arrives',

// --- Drawing ---------------------------------------------------------------------------------------
//
// Which card and when, never whether. The draw is weighted so that most years are ordinary, because
// a deck where every year is an attack teaches that nothing works, which is the argument the other
// side makes.
const DRAW_WEIGHTS = { ordinary: 5, stopped: 3, quiet: 3, scheme: 4 };

function drawCard(s, deck) {
  const eligible = deck.filter((card) => card.when(s));
  if (eligible.length === 0) return null;
  // Weighted by kind and then chosen inside it, rather than weighted per card. Weighting per card
  // would make schemes the common year purely because more of them are written, and a deck where
  // most years are an attack teaches that nothing works, which is the argument the other side makes.
  const byKind = new Map();
  for (const card of eligible) {
    if (!byKind.has(card.kind)) byKind.set(card.kind, []);
    byKind.get(card.kind).push(card);
  }
  const weighted = [];
  for (const kind of byKind.keys()) {
    for (let i = 0; i < (DRAW_WEIGHTS[kind] ?? 1); i += 1) weighted.push(kind);
  }
  // Ten tries at a card that can build itself from this board, then the year opens with nothing,
  // which is itself a fine year.
  for (let i = 0; i < 10; i += 1) {
    const card = pickOne(s.rng, byKind.get(pickOne(s.rng, weighted)));
    const built = card.build(s);
    if (built) {
      return {
        id: card.id,
        kind: card.kind,
        scheme: card.scheme ?? null,
        ...built,
      };
    }
  }
  return null;
}





// The Peace-Battle 2 year loop, headless. Work item 6 of issue #47.
//
// This file is the model. It holds no policy and no tuning report — tune-year-loop.mjs supplies a
// careful player and a careless one and sweeps them over seeds. Splitting them keeps the rules
// honest: a rule that only makes sense because of how one policy plays it is visible here as a rule
// that reads oddly on its own.
//
// Everything it starts from is committed: the residents from items 3 and 4, the year from item 5,
// and the taxonomy's own shape. Nothing reads the Directory.










// --- The board ------------------------------------------------------------------------------------
//
// The six-place fixed map is gone. The board opens where the Directory reached and grows outward,
// because a single walled place is the shape the adversary is built to take. Which places exist, how
// they link, and what they stand for all live in world-places.mjs — item 1 — and this file only
// plays them.

// --- The knobs item 6 exists to set ---------------------------------------------------------------
//
// Every number here is a magnitude that could not be read off the opening board. They are swept
// rather than chosen, and the values below are what the sweep settled on.
const DEFAULT_TUNING = {
  // What one action moves.
  reachClears: 1, // isolation a Reach takes off a place
  reachClearsWhereItRuns: 2, // and where the place already runs, because people there do the work
  // Teaching is per teacher, which is the Du Bois arithmetic the whole game rests on: 2,000 trained
  // 50,000, who taught nine millions. So one Teach reaches this many people for every findable person
  // who already works in that sector. A sector held by one person teaches one person; a sector held by
  // sixty-eight teaches the board. It is why the thin end of the list is the real problem and why
  // looking for people and teaching them are the same strategy rather than two.
  teachPerTeacher: 1.3,
  lookYield: 16, // people one Look pulls out of the pool

  // What the year does back.
  // The map game grew isolation in two of sixteen places a round. This board has six, so the same
  // two would be five times the pressure per place, and the sweep showed exactly that: a careful
  // player spent two actions in three holding the board and never got to the catalog. One place a
  // year is the same rate against the board that exists.
  // A board that grows needs this to grow with it, or opening places is free and distribution stops
  // costing anything. One place a year was the rate against six; against a board that can reach
  // thirty-four it is nothing. So it is a share of what is open, floored at one.
  // Sub-linear on purpose. A bigger network is more resilient, which is the argument this game
  // exists to make, so isolation must not keep pace with the board or growth would be strictly
  // punishing and the thesis would be false on the screen. Six places gain one a year, as before;
  // thirty-four gain two.
  isolationPerSixPlaces: 1,
  maxIsolation: 3, // pushed past this, a place cuts off and pushes into the places beside it
  // Chance a place reached for good stops being so, each year. Holding the network is not a job that
  // finishes.
  coveredComesBack: 0.13,
  unavailableRate: 0.06, // chance a resident is out of reach for a year
  detractorDrift: 0.04, // pressure gained in a year where nothing visible happened
  resultsRelief: 0.03, // pressure lost in a year where something did
  arithmeticEffect: 0.25, // pressure one Show the arithmetic takes off
  startingPressure: 0.2,
  // Nobody on the board holds more than this. It is the most skills any one of the 147 holds, so a
  // run cannot pile the whole catalog onto a handful of people the real list has no equivalent of.
  maxSkillsPerPerson: 24,
  // How many findable people a skill wants behind it before teaching moves on. Below this, one
  // unavailability roll takes the skill off the map.
  depthGoal: 3,

  // --- Admission -----------------------------------------------------------------------------------
  //
  // Somebody arrives, the player sees what they can do, and never learns what they are. There is no
  // accuse control, no reveal, and no flag the player is invited to guess at, because a suspicion
  // game would have survivors rehearse the thing being done to them. The filter is structural: the
  // network runs on exchange, and somebody producing none drifts out on their own.
  //
  // So this share exists in the model and is never surfaced. What the player can see is that Look is
  // less efficient than its headline number, which is true and is the lesson.
  newPlaceIsolation: OPENING_COST.newPlaceIsolation,
  // Actions grow with the board, or a network of thirty places is held with the same three moves a
  // network of six was and growing is a mistake. Capped, because this is played on a phone.
  actionsPerEightPlaces: 1,
  maxActionsPerYear: 6,
  peopleAtFirstReach: OPENING_COST.peopleAtFirstReach,
  firstInRegionExtra: OPENING_COST.firstInRegionExtra,

  neverExchangesShare: 0.12,
  driftOutAfter: 3, // years without exchanging anything before somebody drifts out
  // Somebody in a place that is not running still exchanges, just less: most real help never touches
  // an app and happens between people directly.
  exchangeWhereNothingRuns: 0.35,

  // What a findable person in a running place is worth to the index in a year. This is the Workforce
  // benchmark the product already runs on, used as the index unit it is — a relative figure in the
  // spirit of GDP, never money and never carrying a currency mark.
  indexPerFindablePersonPerYear: 142_500,
  // Open posts against settled ones. Most posts never close, which is the pair the game is showing.
  postsPerFindablePersonPerYear: 1.4,
};

// --- Setup ---------------------------------------------------------------------------------------

function makeRng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const pick = (rng, list) => list[Math.floor(rng() * list.length)];
const weightedPick = (rng, entries) => {
  const total = entries.reduce((a, e) => a + e[1], 0);
  let roll = rng() * total;
  for (const [value, weight] of entries) {
    roll -= weight;
    if (roll <= 0) return value;
  }
  return entries[entries.length - 1][0];
};

// Hand each sector's skills to the residents who hold that sector. Both sums are known — every
// skill's holder count, and every resident's count inside the sector — so this is the same
// two-sided problem the resident generator hit. Largest demand first, to the residents with the most
// room left, satisfies it whenever it is satisfiable, because a skill needing many holders is the
// constraint and the residents with room are interchangeable.
function dealSkills(residents, skillsBySector) {
  const holders = new Map();
  const problems = [];
  for (const [sector, demands] of Object.entries(skillsBySector)) {
    const room = residents
      .filter((r) => r.sectors[sector])
      .map((r) => ({ r, left: r.sectors[sector] }));
    const order = demands.map((demand, index) => ({ id: `${sector}#${index}`, demand }))
      .sort((a, b) => b.demand - a.demand);
    for (const skill of order) {
      room.sort((a, b) => b.left - a.left);
      const takers = room.slice(0, skill.demand).filter((slot) => slot.left > 0);
      if (takers.length < skill.demand) {
        problems.push(`${skill.id} wants ${skill.demand} holders, ${takers.length} have room`);
      }
      holders.set(skill.id, new Set(takers.map((slot) => slot.r.id)));
      for (const slot of takers) {
        slot.left -= 1;
        slot.r.skills.add(skill.id);
      }
    }
  }
  return { holders, problems };
}

// Links are not drawn once. They form as places join: everything inside a region connects to
// everything else inside it, and a region reaches the world through its bridges. So cutting a bridge
// isolates a region rather than a place, which is what a network spread thin actually costs.
function rebuildLinks(s) {
  const names = s.places.map((p) => p.key);
  s.links = new Map(names.map((name) => [name, linksFor(name, names)]));
  return s.links;
}

// The four committed files, read from disk. The browser has no disk, so it passes the same four
// through `sources` instead — one model, two callers, nothing hand-copied between them.
function loadSources() { return SOURCES; }

function buildStartingState(seed, tuning = DEFAULT_TUNING, sources = null) {
  const { shape, board, opening, taxonomy } = sources ?? loadSources();
  const rng = makeRng(seed);

  const residents = board.residents.map((r) => ({
    id: r.id,
    name: r.name,
    place: r.place,
    sectors: { ...r.sectors },
    skills: new Set(),
    away: false,
    // Everybody the Directory already holds exchanges. The share that does not is something that
    // arrives later, with people who arrive later.
    exchanges: 0,
    quietYears: 0,
    neverExchanges: false,
  }));
  const { holders, problems } = dealSkills(residents, board.skillsBySector);
  if (problems.length > 0) throw new Error(`skills could not be dealt:\n  - ${problems.join('\n  - ')}`);

  // Every skill in the taxonomy sits in a sector, and its id is that sector and its place in it. The
  // ones the Directory already holds came out of the deal above; the rest are what a run has to reach.
  const skillsBySector = { ...taxonomy.skillsBySector };

  const standsFor = apportion(Object.fromEntries(opening.places.map((p) => [p.place, p.standsFor])));

  // The board opens with the six the Directory reached. Everything else is a place the network can
  // grow to, and growing to it is a move the player makes.
  const places = OPENING_PLACES.map((name) => ({
    key: name,
    region: regionOf(name),
    standsFor: standsFor[name],
    isolation: 0,
    covered: false,
    cutOff: false,
    openedInYear: 1,
  }));
  // Three places start already struggling, the way the map game opens. The dice choose which.
  const free = places.map((_, i) => i);
  for (let k = 0; k < 3; k += 1) {
    const at = free.splice(Math.floor(rng() * free.length), 1)[0];
    places[at].isolation = 1 + Math.floor(rng() * 2);
  }

  const unopened = [];
  for (const region of REGIONS) {
    for (const place of region.places) {
      unopened.push({ key: place.name, region: region.key, standsFor: standsFor[place.name] });
    }
  }

  const state = {
    rng,
    tuning,
    year: 1,
    years: opening.year.years,
    actionsPerYear: opening.year.actionsPerYear,
    taxonomySkills: taxonomy.totalSkills,
    residents,
    nextResidentId: residents.length + 1,
    holders,
    skillsBySector,
    places,
    unopened,
    links: new Map(),
    standsFor,
    survivorPopulation: SURVIVOR_POPULATION,
    teams: opening.teams.map((t) => ({ name: t.name, sectors: t.sectors })),
    pressure: tuning.startingPressure,
    settledIndex: 0,
    projectedIndex: 0,
    teachingQueued: [],
    lookingQueued: [],
    somethingVisible: false,
    // The distributions a newcomer is drawn from are the Directory's own.
    shape,
    given: board.names?.given ?? GIVEN,
    surname: board.names?.surname ?? SURNAME,
    newSkillRateAtStart: opening.catalog.newSkillRateAtStart,
    missingAtStart: taxonomy.totalSkills - opening.figures.skillsHeldAtStart,
    openingCredit: 0,
    opened: [],
    card: null,
    cardMix: {},
    quietYears: 0,
    actionsLostThisYear: 0,
    driftedOut: 0,
    log: [],
    over: null,
  };
  rebuildLinks(state);
  return state;
}

// --- Reading the board ---------------------------------------------------------------------------

const placeOf = (s, key) => s.places.find((p) => p.key === key);

function findableResidents(s) {
  const out = [];
  for (const r of s.residents) {
    if (r.away) continue;
    const place = placeOf(s, r.place);
    if (!place || place.cutOff) continue;
    out.push(r);
  }
  return out;
}

// A skill is present when somebody findable holds it. That is the issue's own wording for the win
// condition, and it is what gives isolation its bite: a place cutting off does not only stop its
// people working, it takes every skill nobody else holds off the map with them. So this is recomputed
// rather than counted once, and a skill can leave the catalog as well as enter it.
function skillDepth(s) {
  const findable = new Set(findableResidents(s).map((r) => r.id));
  const depth = new Map();
  for (const [skillId, holders] of s.holders) {
    let n = 0;
    for (const holder of holders) if (findable.has(holder)) n += 1;
    if (n > 0) depth.set(skillId, n);
  }
  return depth;
}

function presentSkills(s) {
  return new Set(skillDepth(s).keys());
}

function missingInSector(s, sector, present) {
  const out = [];
  for (let i = 0; i < s.skillsBySector[sector]; i += 1) {
    const id = `${sector}#${i}`;
    if (!present.has(id)) out.push(id);
  }
  return out;
}

const missingCount = (s, present = presentSkills(s)) => s.taxonomySkills - present.size;

// How many people one Teach in this sector reaches: the Du Bois arithmetic, bounded by the people
// there are to teach.
function teachingCapacity(s, sector, findable = findableResidents(s)) {
  const teachers = findable.filter((r) => r.sectors[sector]).length;
  if (teachers === 0) return 0;
  return Math.min(findable.length, Math.max(1, Math.round(teachers * s.tuning.teachPerTeacher)));
}

// A place runs when the network it is connected to can fill all thirteen jobs — not when the place
// can fill them alone. The board before this one asked each place to fill them alone. No place holds
// all thirteen, a place trying to is playing badly, and somewhere with four people runs because it
// is joined to somewhere that has the rest.
//
// Which makes cutting a link the attack that matters. A region severed from the network does not
// lose its people; it loses everybody else's, and stops.
function components(s) {
  const live = s.places.filter((p) => !p.cutOff);
  const seen = new Set();
  const out = [];
  for (const start of live) {
    if (seen.has(start.key)) continue;
    const group = [];
    const queue = [start.key];
    seen.add(start.key);
    while (queue.length > 0) {
      const key = queue.pop();
      group.push(key);
      for (const next of s.links.get(key) ?? []) {
        if (seen.has(next)) continue;
        const place = placeOf(s, next);
        if (!place || place.cutOff) continue;
        seen.add(next);
        queue.push(next);
      }
    }
    out.push(group);
  }
  return out;
}

function placesThatRun(s) {
  const findable = findableResidents(s);
  const running = [];
  for (const group of components(s)) {
    const here = findable.filter((r) => group.includes(r.place));
    const covers = s.teams.every((team) => here.some((r) => team.sectors.some((sec) => r.sectors[sec])));
    if (!covers) continue;
    for (const key of group) running.push(placeOf(s, key));
  }
  return running;
}

// Which of the thirteen the network a place sits in cannot fill. What the screen shows when a place
// has stopped, because the answer is never "this place is short" — it is the network that is short.
function teamsMissingFor(s, placeKey) {
  const group = components(s).find((g) => g.includes(placeKey)) ?? [placeKey];
  const here = findableResidents(s).filter((r) => group.includes(r.place));
  return s.teams
    .filter((team) => !here.some((r) => team.sectors.some((sec) => r.sectors[sec])))
    .map((team) => team.name);
}

// --- The actions ---------------------------------------------------------------------------------

const ACTIONS = {
  reach(s, placeKey) {
    const place = placeOf(s, placeKey);
    if (!place || place.covered || place.cutOff) return false;
    // Nothing to push back where nothing is wrong, the same way the map game refuses to help in a
    // place that needs nothing. So a place has to be in trouble before it can be put beyond it.
    if (place.isolation === 0) return false;
    // The Directory only takes root where the place can already fill all thirteen jobs. Somewhere
    // that cannot feed itself or keep its water on does not become permanently reachable because
    // somebody visited. So a place that does not run can be pulled back from the edge but never
    // finished, and the first sweep is what forced this rule in: with covering cheap and permanent,
    // a careful player locked all six places by year ten and isolation had nowhere left to grow,
    // which made two of the game's three kinds of friction cost exactly nothing.
    const runs = placesThatRun(s).some((p) => p.key === placeKey);
    place.isolation -= runs ? s.tuning.reachClearsWhereItRuns : s.tuning.reachClears;
    if (place.isolation <= 0) {
      if (runs) {
        place.isolation = 0;
        place.covered = true;
        s.somethingVisible = true;
      } else {
        place.isolation = 1;
      }
    }
    return true;
  },
  // Teaching happens somewhere. The people who learn are the findable people in that place; the
  // teachers can be anywhere, because coordinating that is what the Directory is for. So a small
  // place is hard to staff however many teachers the board has, which is true and is the reason a
  // thin place stays thin.
  teach(s, sector, placeKey) {
    s.teachingQueued.push({ sector, place: placeKey ?? s.places[0].key });
    return true;
  },
  look(s, placeKey) {
    const place = placeOf(s, placeKey);
    if (!place || place.cutOff) return false;
    s.lookingQueued.push(placeKey);
    return true;
  },
  showTheArithmetic(s) {
    s.pressure = Math.max(0, s.pressure - s.tuning.arithmeticEffect);
    return true;
  },
  // Open a way somewhere new. The player picks the region; the dice pick which place inside it —
  // which and when, never whether. A region nobody has reached yet costs more, because somebody has
  // to get there at all before anybody there can be found.
  //
  // Growth is not free and is not meant to be. A place arrives already under pressure, and the
  // isolation the year spreads is a share of how many places are open, so every one added is another
  // thing that can be cut. Spreading thin and holding what you spread are the same decision.
  openAWay(s, regionKey) {
    const waiting = s.unopened.filter((p) => !regionKey || p.region === regionKey);
    if (waiting.length === 0) return false;
    const first = !s.places.some((p) => p.region === (regionKey ?? waiting[0].region));
    if (first && s.openingCredit < s.tuning.firstInRegionExtra) {
      // A first reach into a region takes more than one action. The credit carries between years so
      // that starting one is a commitment rather than a coin flip.
      s.openingCredit += 1;
      return true;
    }
    s.openingCredit = 0;
    const at = Math.floor(s.rng() * waiting.length);
    const chosen = waiting[at];
    s.unopened.splice(s.unopened.indexOf(chosen), 1);
    s.places.push({
      key: chosen.key,
      region: chosen.region,
      standsFor: chosen.standsFor,
      isolation: s.tuning.newPlaceIsolation,
      covered: false,
      cutOff: false,
      openedInYear: s.year,
    });
    rebuildLinks(s);
    // People who were already there and become findable once there is a way to reach them.
    for (let i = 0; i < s.tuning.peopleAtFirstReach; i += 1) s.lookingQueued.push(chosen.key);
    s.somethingVisible = true;
    s.opened.push({ year: s.year, place: chosen.key, region: chosen.region });
    return true;
  },
};

function regionsWithRoom(s) {
  const out = new Map();
  for (const place of s.unopened) {
    out.set(place.region, (out.get(place.region) ?? 0) + 1);
  }
  return out;
}

// --- What resolves on its own --------------------------------------------------------------------

function gainSkill(s, resident, skillId, sector) {
  if (resident.skills.has(skillId)) return false;
  if (resident.skills.size >= s.tuning.maxSkillsPerPerson) return false;
  resident.skills.add(skillId);
  resident.sectors[sector] = (resident.sectors[sector] ?? 0) + 1;
  if (!s.holders.has(skillId)) s.holders.set(skillId, new Set());
  s.holders.get(skillId).add(resident.id);
  s.somethingVisible = true;
  return true;
}

function resolveTeaching(s) {
  const findable = findableResidents(s);
  if (findable.length === 0) { s.teachingQueued = []; return; }
  const depth = skillDepth(s);
  for (const { sector, place } of s.teachingQueued) {
    const inPlace = findable.filter((r) => r.place === place);
    const learners = Math.min(teachingCapacity(s, sector, findable), inPlace.length);
    if (learners === 0) continue;
    const missing = missingInSector(s, sector, new Set(depth.keys()));
    // A sector whose catalog is complete is still worth teaching, because a skill one person holds is
    // gone the year that person is. Once there is nothing missing, teaching thickens the thinnest
    // thing in the sector instead. That is replacement level being built on purpose rather than
    // hoped for.
    const thin = [];
    for (let i = 0; i < s.skillsBySector[sector]; i += 1) {
      const id = `${sector}#${i}`;
      const held = depth.get(id) ?? 0;
      if (held > 0 && held < s.tuning.depthGoal) thin.push({ id, held });
    }
    thin.sort((a, b) => a.held - b.held);
    for (let i = 0; i < learners; i += 1) {
      const learner = pick(s.rng, inPlace);
      // Teaching is the only action that can aim at a skill nobody findable holds. The player picks
      // the sector; the dice pick which skill inside it.
      if (missing.length > 0) {
        const at = Math.floor(s.rng() * missing.length);
        if (gainSkill(s, learner, missing[at], sector)) missing.splice(at, 1);
      } else if (thin.length > 0) {
        const next = thin.shift();
        if (gainSkill(s, learner, next.id, sector)) next.held += 1;
        if (next.held < s.tuning.depthGoal) thin.push(next);
      }
    }
  }
  s.teachingQueued = [];
}

function newcomerSkillCount(s) {
  const n = weightedPick(s.rng, Object.entries(s.shape.skillsPerProfile).map(([k, v]) => [Number(k), v]));
  return Math.max(1, n);
}

function newcomerSectors(s, howMany) {
  const entries = Object.entries(s.shape.sectorFrequency);
  const out = new Set();
  let guard = 0;
  while (out.size < howMany && guard < 40) {
    out.add(weightedPick(s.rng, entries));
    guard += 1;
  }
  return [...out];
}

function resolveLooking(s) {
  const present = presentSkills(s);
  for (const placeKey of s.lookingQueued) {
    for (let i = 0; i < s.tuning.lookYield; i += 1) {
      // A detractor lowers the chance somebody joins and stays findable. Answering the arithmetic is
      // what moves that, which is the honest mechanic and also the true one.
      if (s.rng() < s.pressure) continue;
      const resident = {
        id: `n${s.nextResidentId}`,
        name: `${pick(s.rng, s.given)} ${pick(s.rng, s.surname)}`,
        place: placeKey,
        sectors: {},
        skills: new Set(),
        away: false,
        exchanges: 0,
        quietYears: 0,
        // Never read by anything the player can see. No screen names it, no control asks about it,
        // and nothing reveals it at the end of a run. It exists so that Look is worth less than its
        // headline number, which is the true thing and the only thing the player needs.
        neverExchanges: s.rng() < s.tuning.neverExchangesShare,
      };
      s.nextResidentId += 1;
      const count = newcomerSkillCount(s);
      const sectors = newcomerSectors(s, Math.min(count, 1 + Math.floor(s.rng() * 2)));
      // How often a newcomer brings a skill nobody has is the rate the opening board measured,
      // falling as the catalog fills. It is not a knob.
      const rate = s.newSkillRateAtStart * (missingCount(s, present) / s.missingAtStart);
      for (let k = 0; k < count; k += 1) {
        const sector = pick(s.rng, sectors);
        const missing = missingInSector(s, sector, present);
        if (missing.length > 0 && s.rng() < rate) {
          const at = Math.floor(s.rng() * missing.length);
          if (gainSkill(s, resident, missing[at], sector)) present.add(missing[at]);
        } else if (s.skillsBySector[sector] > 0) {
          gainSkill(s, resident, `${sector}#${Math.floor(s.rng() * s.skillsBySector[sector])}`, sector);
        }
      }
      s.residents.push(resident);
      s.somethingVisible = true;
    }
  }
  s.lookingQueued = [];
}

function rollUnavailability(s) {
  for (const r of s.residents) {
    // Somebody a card sent away stays away until the year it said, rather than being re-rolled back
    // into reach the following spring.
    if (r.awayUntil && r.awayUntil > s.year) { r.away = true; continue; }
    if (r.awayUntil) delete r.awayUntil;
    r.away = s.rng() < s.tuning.unavailableRate;
  }
}

function spreadIsolation(s) {
  // Nothing stays safe. Reaching a place for good takes it off the worry list, and then some years
  // it comes back, because the other side does not stop when a place stops being interesting.
  //
  // Without this the game has a fixed point a careful player always reaches: cover everything, and
  // isolation has nowhere left to land. The first build had the same hole and hid it behind a board
  // too small to finish. On a board that can be finished it has to be shut properly, and shutting it
  // with a knob would not have worked — isolation at two and a half times did nothing at all, because
  // the problem was never the rate.
  for (const place of s.places) {
    if (!place.covered || place.cutOff) continue;
    if (s.rng() >= s.tuning.coveredComesBack) continue;
    place.covered = false;
    place.isolation = 1;
  }
  const open = s.places.filter((p) => !p.covered && !p.cutOff);
  const chain = new Set();
  const push = (place) => {
    if (place.covered || place.cutOff) return;
    if (place.isolation < s.tuning.maxIsolation) {
      place.isolation += 1;
      return;
    }
    if (chain.has(place.key)) return;
    chain.add(place.key);
    place.cutOff = true;
    for (const next of s.links.get(place.key)) push(placeOf(s, next));
  };
  // A share of what is open rather than a flat count, so opening places costs something. Floored at
  // one so a board held down to a handful still feels pressure.
  const howMany = Math.max(1, Math.round(s.tuning.isolationPerSixPlaces * Math.sqrt(s.places.length / 6)));
  for (let i = 0; i < howMany && open.length > 0; i += 1) {
    push(open.splice(Math.floor(s.rng() * open.length), 1)[0]);
  }
}

function settle(s) {
  const running = new Set(placesThatRun(s).map((p) => p.key));
  const findable = findableResidents(s);
  let value = 0;
  for (const r of findable) {
    if (r.neverExchanges) continue;
    // Somewhere that runs, a person's work goes through the network. Somewhere that does not, people
    // still help each other directly and most of it is never recorded anywhere — less value on the
    // board, and not nothing.
    value += running.has(r.place) ? 1 : s.tuning.exchangeWhereNothingRuns;
    r.exchanges += 1;
  }
  s.settledIndex += Math.round(value * s.tuning.indexPerFindablePersonPerYear);
  s.projectedIndex += Math.round(value * s.tuning.postsPerFindablePersonPerYear
    * s.tuning.indexPerFindablePersonPerYear);
}

// Nobody is accused and nobody is removed. Somebody who has exchanged nothing for long enough stops
// being around, which is what happens when a place runs on exchange and a person offers none.
function driftOut(s) {
  const before = s.residents.length;
  s.residents = s.residents.filter((r) => {
    if (r.exchanges > 0) { r.quietYears = 0; return true; }
    r.quietYears += 1;
    if (r.quietYears < s.tuning.driftOutAfter) return true;
    for (const holders of s.holders.values()) holders.delete(r.id);
    return false;
  });
  s.driftedOut += before - s.residents.length;
}

// The year opens with a draw. Dice choose which card and how large it lands, never whether a good
// run succeeds — a strategy that loses on a roll would be teaching that this comes down to luck.
function beginYear(s) {
  if (!s.deck) s.deck = buildDeck(DECK_API);
  s.actionsLostThisYear = 0;
  s.card = drawCard(s, s.deck);
  const kind = s.card ? s.card.kind : 'none';
  s.cardMix[kind] = (s.cardMix[kind] ?? 0) + 1;
  return s.card;
}

function chooseOnCard(s, key) {
  if (!s.card) return false;
  const choice = s.card.choices.find((c) => c.key === key);
  if (!choice) return false;
  choice.apply(s);
  s.card = null;
  return true;
}

function endYear(s) {
  s.somethingVisible = false;
  settle(s);
  driftOut(s);
  resolveTeaching(s);
  resolveLooking(s);
  rollUnavailability(s);
  spreadIsolation(s);
  s.quietYears = s.somethingVisible ? 0 : s.quietYears + 1;
  s.pressure = Math.min(1, Math.max(0, s.somethingVisible
    ? s.pressure - s.tuning.resultsRelief
    : s.pressure + s.tuning.detractorDrift));
  if (missingCount(s) === 0) {
    s.over = { won: true, year: s.year };
  } else if (s.year >= s.years) {
    s.over = { won: false, year: s.year };
  }
  s.year += 1;
}

// A network of thirty places cannot be held with the three moves a network of six was held with, so
// the year's actions grow with the board. Capped, because this is played on a phone with one hand.
function actionsThisYear(s) {
  const live = s.places.filter((p) => !p.cutOff).length;
  const base = Math.min(
    s.tuning.maxActionsPerYear,
    s.actionsPerYear + Math.floor(live / 8) * s.tuning.actionsPerEightPlaces,
  );
  return Math.max(1, base - (s.actionsLostThisYear ?? 0));
}

// What the deck is allowed to see. Passed in rather than imported the other way so that the deck
// can read the board and act through the same actions a player has, and nothing else.
const DECK_API = {
  ACTIONS: null, // filled below, once ACTIONS exists
  findableResidents,
  skillDepth,
  presentSkills,
  missingInSector,
  teachingCapacity,
  placesThatRun,
  teamsMissingFor,
  components,
};
DECK_API.ACTIONS = ACTIONS;

function runGame(seed, policy, tuning = DEFAULT_TUNING, onCard = null, sources = null) {
  const s = buildStartingState(seed, tuning, sources);
  while (!s.over) {
    beginYear(s);
    if (s.card) {
      const key = onCard ? onCard(s, s.card) : s.card.choices[0].key;
      chooseOnCard(s, key);
    }
    const acts = actionsThisYear(s);
    for (let i = 0; i < acts; i += 1) policy(s);
    endYear(s);
  }
  return {
    won: s.over.won,
    year: s.over.year,
    skillsPresent: s.taxonomySkills - missingCount(s),
    taxonomySkills: s.taxonomySkills,
    people: s.residents.length,
    placesOpen: s.places.length,
    placesCovered: s.places.filter((p) => p.covered).length,
    placesCutOff: s.places.filter((p) => p.cutOff).length,
    placesRunning: placesThatRun(s).length,
    reached: s.places.filter((p) => !p.cutOff).reduce((a, p) => a + p.standsFor, 0),
    driftedOut: s.driftedOut,
    cardMix: s.cardMix,
    settledIndex: s.settledIndex,
    projectedIndex: s.projectedIndex,
    pressure: Math.round(s.pressure * 100) / 100,
  };
}


// The screen. Work items 6, 7, 8 and 9 of issue #47.
//
// Everything above this in the bundle is the model, dropped in unchanged from the files the headless
// sweep runs. Nothing here decides a rule. It draws the board, offers the year's card, and passes
// the player's choice back into the same actions the sweep uses.

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var S = null; // the run
  var selectedPlace = null;
  var selectedSector = null;
  var events = [];
  var showSchemeNames = false;

  var STORE_KEY = 'peace-battle-2';

  // --- Storage -----------------------------------------------------------------------------------
  //
  // A run is the seed plus the moves that produced it, so what is kept is the seed and enough to say
  // where the run got to. Replaying from a seed is what makes a shared seed mean anything.
  function save() {
    try {
      window.storage.set(STORE_KEY, {
        seed: S ? S.seed : null,
        names: showSchemeNames,
      });
    } catch (e) { /* storage can be unavailable; the game still runs */ }
  }

  function load() {
    try { return window.storage.get(STORE_KEY) || {}; } catch (e) { return {}; }
  }

  // --- Small helpers ------------------------------------------------------------------------------

  var fmt = function (n) { return Math.round(n).toLocaleString('en-US'); };
  var short = function (name) {
    return name
      .replace('United States — state not given', 'US, state not given')
      .replace('United States — elsewhere', 'US, elsewhere')
      .replace('United States — ', '')
      .replace('Outside the US and UK', 'Outside US and UK');
  };
  var billions = function (n) {
    if (n >= 1e9) return (n / 1e9).toFixed(1) + ' billion';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + ' million';
    return fmt(n);
  };

  function say(text, tone) {
    events.unshift({ text: text, tone: tone || '' });
    if (events.length > 4) events.pop();
  }

  // --- Starting a run -----------------------------------------------------------------------------

  function start(seed) {
    S = buildStartingState(seed >>> 0, DEFAULT_TUNING, SOURCES);
    S.seed = seed >>> 0;
    S.given = GIVEN;
    S.surname = SURNAME;
    S.actsLeft = actionsThisYear(S);
    selectedPlace = S.places[0].key;
    selectedSector = null;
    events = [];
    say('The board opens where the Directory reached. Everywhere else is somewhere to grow to.');
    beginYear(S);
    S.actsLeft = actionsThisYear(S);
    save();
    draw();
  }

  // --- The card -----------------------------------------------------------------------------------

  var KIND_LABEL = {
    ordinary: 'This year',
    stopped: 'Something has stopped',
    quiet: 'Nothing has shown',
    scheme: 'Something was done to the network',
  };

  function drawCardBox() {
    var box = $('cardBox');
    box.innerHTML = '';
    if (!S.card || S.over) return;
    var card = S.card;

    var el = document.createElement('div');
    el.className = 'card' + (card.kind === 'scheme' ? ' scheme' : '');

    var kind = document.createElement('div');
    kind.className = 'kind';
    kind.textContent = KIND_LABEL[card.kind] || 'This year';
    el.appendChild(kind);

    var h = document.createElement('h2');
    h.textContent = card.title;
    el.appendChild(h);

    card.lines.forEach(function (line) {
      var p = document.createElement('p');
      p.textContent = line;
      el.appendChild(p);
    });

    var picks = document.createElement('div');
    picks.className = 'picks';
    card.choices.forEach(function (choice) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick';
      var label = document.createElement('span');
      label.className = 'pl';
      label.textContent = choice.label;
      var cost = document.createElement('span');
      cost.className = 'pc';
      cost.textContent = choice.cost;
      b.appendChild(label);
      b.appendChild(cost);
      b.addEventListener('click', function () {
        chooseOnCard(S, choice.key);
        say(choice.label + '.', card.kind === 'scheme' ? 'bad' : '');
        draw();
      });
      picks.appendChild(b);
    });
    el.appendChild(picks);

    // Item 7. The card face carries the effect; the name sits behind this, closed unless the player
    // has said otherwise. Somebody should be able to play without reading the name of a method they
    // have lived through, and ClickLog's scheme tags mark real incidents — they are evidence, and the
    // game is not.
    if (card.scheme) {
      var named = document.createElement('details');
      named.className = 'named';
      if (showSchemeNames) named.open = true;
      var sum = document.createElement('summary');
      sum.textContent = 'What this was';
      named.appendChild(sum);
      var p = document.createElement('p');
      p.innerHTML = 'This is the one called <span class="nm"></span>. It is on the named list the app '
        + 'uses to tag real incidents, and the Dictionary carries what it means.';
      p.querySelector('.nm').textContent = card.scheme.label;
      named.appendChild(p);
      el.appendChild(named);
    }

    box.appendChild(el);
  }

  // --- The board ----------------------------------------------------------------------------------

  function placeState(place) {
    if (place.cutOff) return { cls: 'gone', text: 'cut off' };
    if (place.covered) return { cls: 'held', text: 'reached for good' };
    var running = placesThatRun(S).some(function (p) { return p.key === place.key; });
    if (!running) return { cls: 'stop', text: 'stopped' };
    if (place.isolation > 0) return { cls: 'run', text: 'isolation ' + place.isolation };
    return { cls: 'run', text: 'running' };
  }

  function drawPlaces() {
    var wrap = $('places');
    wrap.innerHTML = '';
    var findable = findableResidents(S);
    S.places.forEach(function (place) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pbtn';
      b.setAttribute('aria-pressed', String(place.key === selectedPlace));
      var here = findable.filter(function (r) { return r.place === place.key; }).length;
      var st = placeState(place);
      b.innerHTML = '<span class="n"></span><span class="v"></span><span class="st ' + st.cls + '"></span>';
      b.querySelector('.n').textContent = short(place.key);
      b.querySelector('.v').textContent = here;
      b.querySelector('.st').textContent = st.text;
      b.addEventListener('click', function () {
        selectedPlace = place.key;
        selectedSector = null;
        draw();
      });
      wrap.appendChild(b);
    });
  }

  function drawRoster() {
    var place = S.places.find(function (p) { return p.key === selectedPlace; });
    if (!place) return;
    var findable = findableResidents(S);
    var group = components(S).find(function (g) { return g.indexOf(place.key) >= 0; }) || [place.key];
    var inNetwork = findable.filter(function (r) { return group.indexOf(r.place) >= 0; });
    var here = findable.filter(function (r) { return r.place === place.key; });

    $('placeName').textContent = short(place.key);
    var st = placeState(place);
    var region = REGION_POINTS[place.region];
    $('placeState').textContent = (region ? region.name + ' · ' : '') + here.length + ' here · joined to '
      + (group.length - 1) + (group.length === 2 ? ' other place' : ' other places') + ' · ' + st.text;

    var roster = $('roster');
    roster.innerHTML = '';
    S.teams.forEach(function (team) {
      var inNet = inNetwork.filter(function (r) {
        return team.sectors.some(function (sec) { return r.sectors[sec]; });
      });
      var atPlace = here.filter(function (r) {
        return team.sectors.some(function (sec) { return r.sectors[sec]; });
      });
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'job' + (inNet.length === 0 ? ' empty' : (inNet.length < 3 ? ' thin' : ''));
      var sector = team.sectors.slice().sort(function (a, c) {
        return teachingCapacity(S, c, findable) - teachingCapacity(S, a, findable);
      })[0];
      b.setAttribute('aria-pressed', String(sector === selectedSector));
      var whoText = inNet.length === 0
        ? 'nobody in the network'
        : inNet.length + ' in the network' + (atPlace.length ? ' · ' + atPlace.length + ' here' : '');
      b.innerHTML = '<span class="jn"></span><span class="who"></span>';
      b.querySelector('.jn').textContent = team.name;
      b.querySelector('.who').textContent = whoText;
      if (inNet.length > 0 && inNet.length < 3) {
        var hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = 'one bad year from empty';
        b.querySelector('.jn').appendChild(hint);
      }
      b.addEventListener('click', function () {
        selectedSector = sector;
        draw();
      });
      roster.appendChild(b);
    });
  }

  function drawMap() {
    var svg = $('map');
    var open = {};
    S.places.forEach(function (p) { open[p.key] = p; });
    var parts = [];

    // The view frames what is open rather than the whole world, so six places at the start are a
    // board rather than a cluster in the corner of an empty rectangle. It widens as the network does.
    var xs = [];
    var ys = [];
    S.places.forEach(function (place) {
      var at = LAYOUT[place.key];
      if (at) { xs.push(at.x); ys.push(at.y); }
    });
    var pad = 9;
    var minX = Math.min.apply(null, xs) - pad;
    var maxX = Math.max.apply(null, xs) + pad;
    var minY = Math.min.apply(null, ys) - pad;
    var maxY = Math.max.apply(null, ys) + pad;
    var w = Math.max(maxX - minX, 34);
    var h = Math.max(maxY - minY, 31);
    // Keep the drawn box the same shape as the element so nothing is squashed.
    var ratio = 100 / 92;
    if (w / h < ratio) w = h * ratio; else h = w / ratio;
    var cx = (minX + maxX) / 2;
    var cy = (minY + maxY) / 2;
    svg.setAttribute('viewBox', (cx - w / 2).toFixed(1) + ' ' + (cy - h / 2).toFixed(1)
      + ' ' + w.toFixed(1) + ' ' + h.toFixed(1));
    // Everything drawn scales with the box, so a six-place board and a thirty-four-place one read
    // the same rather than one having hairline links and the other fat ones.
    var unit = w / 100;

    S.places.forEach(function (place) {
      var from = LAYOUT[place.key];
      if (!from) return;
      (S.links.get(place.key) || []).forEach(function (other) {
        var to = LAYOUT[other];
        if (!to || other < place.key) return;
        var live = !place.cutOff && open[other] && !open[other].cutOff;
        parts.push('<line class="link' + (live ? ' live' : '') + '" x1="' + from.x + '" y1="' + from.y
          + '" x2="' + to.x + '" y2="' + to.y + '" stroke-width="' + (0.7 * unit).toFixed(2) + '"/>');
      });
    });

    var findable = findableResidents(S);
    var selectedRadius = 0;
    S.places.forEach(function (place) {
      var at = LAYOUT[place.key];
      if (!at) return;
      var here = findable.filter(function (r) { return r.place === place.key; }).length;
      var st = placeState(place);
      var fill = place.cutOff ? '#a2412c'
        : (place.covered ? '#6f9fd8' : (st.cls === 'stop' ? '#e5794b' : '#57a87a'));
      var radius = Math.max(1.4, Math.min(3.4, 1.2 + Math.sqrt(here) / 3)) * unit;
      if (place.key === selectedPlace) selectedRadius = radius;
      parts.push('<g class="node" data-place="' + place.key.replace(/"/g, '') + '">'
        + '<circle cx="' + at.x + '" cy="' + at.y + '" r="' + radius.toFixed(2) + '" fill="' + fill + '"/>'
        + (place.key === selectedPlace
          ? '<circle class="sel" cx="' + at.x + '" cy="' + at.y + '" r="' + (radius + 1.6 * unit).toFixed(2)
            + '" stroke-width="' + (0.7 * unit).toFixed(2) + '"/>'
          : '')
        + '</g>');
    });

    // Only the selected place is named on the map. Labelling every region collided with the nodes on
    // a full board and told the reader nothing the list below does not; where the selected place sits
    // is the one thing the picture cannot say on its own.
    var chosen = LAYOUT[selectedPlace];
    if (chosen) {
      // Clear of the node and its selection ring, both of which grow with the place.
      var size = 2.9 * unit;
      var above = chosen.y - (selectedRadius + 1.6 * unit + size * 0.9);
      parts.push('<text x="' + chosen.x + '" y="' + above.toFixed(2) + '" '
        + 'font-size="' + size.toFixed(2) + '">' + short(selectedPlace) + '</text>');
    }

    svg.innerHTML = parts.join('');
    Array.prototype.forEach.call(svg.querySelectorAll('.node'), function (node) {
      node.addEventListener('click', function () {
        selectedPlace = node.getAttribute('data-place');
        selectedSector = null;
        draw();
      });
    });
  }

  function drawBars() {
    var bars = $('bars');
    bars.innerHTML = '';
    var present = presentSkills(S);
    var sectors = Object.keys(S.skillsBySector);
    sectors.map(function (sector) {
      var total = S.skillsBySector[sector];
      var held = total - missingInSector(S, sector, present).length;
      return { sector: sector, total: total, held: held };
    }).sort(function (a, b) {
      return (a.held / a.total) - (b.held / b.total) || b.total - a.total;
    }).forEach(function (row) {
      var el = document.createElement('div');
      el.className = 'barrow';
      var pct = row.total === 0 ? 100 : (row.held / row.total) * 100;
      el.innerHTML = '<span class="nm"></span><span class="num"></span>'
        + '<span class="track"><span class="fill' + (row.held >= row.total ? ' done' : '')
        + '" style="width:' + pct.toFixed(1) + '%"></span></span>';
      el.querySelector('.nm').textContent = row.sector;
      el.querySelector('.num').textContent = row.held + '/' + row.total;
      bars.appendChild(el);
    });
  }

  function drawEvents() {
    var box = $('events');
    box.innerHTML = '';
    if (events.length === 0) { box.textContent = ' '; return; }
    events.forEach(function (e) {
      var d = document.createElement('div');
      if (e.tone) d.className = e.tone;
      d.textContent = e.text;
      box.appendChild(d);
    });
  }

  function drawOver() {
    var box = $('overBox');
    box.innerHTML = '';
    if (!S.over) return;
    var el = document.createElement('div');
    el.className = 'over';
    var reached = S.places.filter(function (p) { return !p.cutOff; })
      .reduce(function (a, p) { return a + p.standsFor; }, 0);
    var t = document.createElement('div');
    t.className = 't';
    t.textContent = S.over.won ? 'Every skill present, year ' + S.over.year : 'Two generations, and not done';
    el.appendChild(t);
    var p1 = document.createElement('p');
    p1.textContent = S.over.won
      ? 'All ' + S.taxonomySkills + ' of them held by somebody findable, in a place still joined to the '
        + 'network. ' + S.places.length + ' places open, ' + fmt(reached) + ' of 5,000,000 reached.'
      : (S.taxonomySkills - missingCount(S)) + ' of ' + S.taxonomySkills + ' skills present at the end. '
        + S.places.filter(function (p) { return p.cutOff; }).length + ' places cut off, '
        + fmt(reached) + ' of 5,000,000 still reached.';
    el.appendChild(p1);
    var p2 = document.createElement('p');
    p2.textContent = 'Community Value Index settled ' + billions(S.settledIndex) + ', against '
      + billions(S.projectedIndex) + ' waiting to happen. Neither is money and neither can be cashed.';
    el.appendChild(p2);
    box.appendChild(el);
  }

  // --- Actions -------------------------------------------------------------------------------------

  function spend(ok) {
    if (!ok) { say('Nothing to do there.', 'bad'); draw(); return; }
    S.actsLeft -= 1;
    if (S.actsLeft <= 0) {
      var before = presentSkills(S).size;
      var peopleBefore = S.residents.length;
      endYear(S);
      var after = presentSkills(S).size;
      var gained = after - before;
      var arrived = S.residents.length - peopleBefore;
      if (gained > 0) say(gained + (gained === 1 ? ' skill' : ' skills') + ' present that were not.', 'good');
      if (arrived > 0) say(arrived + (arrived === 1 ? ' person' : ' people') + ' found.', 'good');
      var lost = S.places.filter(function (p) { return p.cutOff; }).length;
      if (lost > 0) say(lost + (lost === 1 ? ' place is' : ' places are') + ' cut off.', 'bad');
      if (!S.over) {
        beginYear(S);
        S.actsLeft = actionsThisYear(S);
      }
    }
    save();
    draw();
  }

  function wire() {
    $('teach').addEventListener('click', function () {
      if (!selectedSector) { say('Pick a job in the list first.', 'bad'); draw(); return; }
      spend(ACTIONS.teach(S, selectedSector, selectedPlace));
    });
    $('look').addEventListener('click', function () { spend(ACTIONS.look(S, selectedPlace)); });
    $('reach').addEventListener('click', function () { spend(ACTIONS.reach(S, selectedPlace)); });
    $('arith').addEventListener('click', function () { spend(ACTIONS.showTheArithmetic(S)); });
    $('openWay').addEventListener('click', function () {
      var room = regionsWithRoom(S);
      if (room.size === 0) { say('Everywhere is open.', 'bad'); draw(); return; }
      // Somewhere already started before somewhere new, because a region's first place costs two
      // actions and leaving one half-open spends them twice.
      var started = [];
      var fresh = [];
      room.forEach(function (count, key) {
        if (S.places.some(function (p) { return p.region === key; })) started.push(key);
        else fresh.push(key);
      });
      var target = started[0] || fresh[0];
      var openBefore = S.places.length;
      var ok = ACTIONS.openAWay(S, target);
      if (ok && S.places.length === openBefore) {
        say('Getting there at all takes more than one year of effort. One more action and somebody is '
          + 'in ' + (REGION_POINTS[target] ? REGION_POINTS[target].name : 'there') + '.');
      } else if (ok) {
        var latest = S.places[S.places.length - 1];
        selectedPlace = latest.key;
        say('A way into ' + latest.key + '.', 'good');
      }
      spend(ok);
    });
    $('reset').addEventListener('click', function () {
      start((Math.random() * 0xffffffff) >>> 0);
    });
    $('seedPlay').addEventListener('click', function () {
      var raw = $('seedInput').value.replace(/[^0-9]/g, '');
      if (!raw) { say('A seed is a number.', 'bad'); draw(); return; }
      start(Number(raw) >>> 0);
    });
    $('seedCopy').addEventListener('click', function () {
      var value = String(S.seed);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(function () {
          say('Seed ' + value + ' copied. Anybody who plays it gets this exact world.', 'good');
          draw();
        }, function () { fallbackCopy(value); });
      } else { fallbackCopy(value); }
    });
  }

  function fallbackCopy(value) {
    var input = $('seedInput');
    input.value = value;
    input.select();
    try { document.execCommand('copy'); } catch (e) { /* the number is in the field either way */ }
    say('Seed ' + value + ' is in the field. Anybody who plays it gets this exact world.');
    draw();
  }

  // --- Item 9: what this is, behind a disclosure ------------------------------------------------------

  function drawAbout() {
    var about = $('about');
    if (about.dataset.built === 'yes') {
      about.querySelector('#nameToggle').checked = showSchemeNames;
      return;
    }
    about.dataset.built = 'yes';
    about.innerHTML = '<summary>What this is</summary>'
      + '<h3>Where the board came from</h3>'
      + '<p>147 people, because that is how many are on the Charging The Future Directory. Not those '
      + 'people: the shape of them. How many hold one skill and how many hold nine, which parts of '
      + 'the work they sit in, how thin each capability is. Everybody here was generated from those '
      + 'counts, and no name or skill was read from anybody’s listing.</p>'
      + '<p>The six places it opens with are where the Directory currently says its people are. That '
      + 'is not the same as where survivors are. Country is a required field, and on a listing built '
      + 'for somebody rather than by them it was filled in from what could be worked out — which '
      + 'skews to the United States, because writing in English reads as American whether or not it '
      + 'is. People correct it themselves once they claim a listing. So the opening board is a '
      + 'starting position, not a census.</p>'
      + '<h3>Why it is not one walled place</h3>'
      + '<p>A single settlement is the shape this adversary is built to take: one address, one set of '
      + 'links, one thing to cut. So no place here holds all thirteen jobs and none is meant to. A '
      + 'place runs when the network it is joined to can fill them, which is why somewhere with four '
      + 'people runs — it is joined to somewhere with the rest, and cutting that link is the '
      + 'attack that matters.</p>'
      + '<h3>How a year goes</h3>'
      + '<p>A card, then your actions, then the year resolves. The dice choose which and when, never '
      + 'whether: which person is reached, which skill turns up, which place isolation grows in. A '
      + 'good run is not a lucky one.</p>'
      + '<p>Actions grow as the board does, because a network of thirty places cannot be held with '
      + 'the three moves six places were held with.</p>'
      + '<h3>Why teaching is the only thing that finishes it</h3>'
      + '<p>Teaching reaches people in proportion to how many already do that work. One person '
      + 'teaches one; sixty-eight teach the board. Du Bois counted it: 2,000 trained 50,000, who '
      + 'taught nine millions. So the thin parts of the list are the hard part — three of the '
      + 'twenty carry a dozen or more skills and rest on one person each, and nobody with those '
      + 'skills walks in by chance. Only teaching reaches them.</p>'
      + '<h3>Who gets in</h3>'
      + '<p>Somebody arrives, you see what they can do, and you never learn what they are. There is '
      + 'no way to check and there is no control here that would let you. The network runs on '
      + 'exchange, so somebody offering none stops being around without anybody deciding it. That is '
      + 'the filter, and it is why looking for people is worth less than the number on the button.</p>'
      + '<h3>Nothing stays held</h3>'
      + '<p>A place reached for good comes off the worry list, and some years it comes back on. The '
      + 'other side does not stop when a place stops being interesting. Holding the network is not a '
      + 'job that finishes, which is the difference between this and a game you can solve.</p>'
      + '<h3>The two figures</h3>'
      + '<p>Settled is what was actually exchanged. Waiting is what the open posts would add if every '
      + 'one of them closed, and most never do. Both are a relative index in the spirit of GDP. '
      + 'Neither is money, a price, or anything anybody can cash.</p>'
      + '<h3>Winning and losing</h3>'
      + '<p>Win by having all 657 skills present in the same year — each held by somebody '
      + 'findable, in a place still joined to the network. 657 is what the list held on '
      + '<span id="countedOn"></span>; it grows, so the number here is the one this was built with. '
      + 'Lose when two generations pass and it is not done. There is no opponent: what you are '
      + 'playing against is the clock, the people who say it cannot be done, and what is done to the '
      + 'links between places.</p>'
      + '<h3>Seeds</h3>'
      + '<p>A seed is the world in one number. The same number gives the same board, the same draws and the '
      + 'same dice, so two people playing one seed are playing the identical run and can compare what '
      + 'they built. Nothing is sent anywhere — the number is the entire arrangement.</p>'
      + '<h3>The named list</h3>'
      + '<p>What is done to the network here is drawn from the app’s own named list of methods. '
      + 'The card tells you what happened; the name sits behind a line you can open if you want it. '
      + 'It is closed to begin with because somebody should be able to play this without reading the '
      + 'name of something they have lived through.</p>'
      + '<label class="toggle"><input type="checkbox" id="nameToggle"> Open the names by default</label>';
    $('countedOn').textContent = SOURCES.taxonomy.pulledOn;
    var toggle = $('nameToggle');
    toggle.checked = showSchemeNames;
    toggle.addEventListener('change', function () {
      showSchemeNames = toggle.checked;
      save();
      draw();
    });
  }

  // --- Drawing everything ---------------------------------------------------------------------------

  function draw() {
    var present = presentSkills(S);
    $('skills').textContent = present.size;
    $('total').textContent = S.taxonomySkills;
    $('year').textContent = S.year;
    $('years').textContent = S.years;
    $('acts').textContent = S.over ? 0 : S.actsLeft;
    $('people').textContent = findableResidents(S).length;
    $('reached').textContent = fmt(S.places
      .filter(function (p) { return !p.cutOff; })
      .reduce(function (a, p) { return a + p.standsFor; }, 0));
    $('settled').textContent = billions(S.settledIndex);
    $('projected').textContent = billions(S.projectedIndex);
    $('seedInput').value = String(S.seed);

    var busy = !!S.card || !!S.over;
    ['teach', 'look', 'reach', 'arith', 'openWay'].forEach(function (id) {
      $(id).disabled = busy;
    });

    drawCardBox();
    drawOver();
    drawPlaces();
    drawRoster();
    drawEvents();
    drawMap();
    drawBars();
    drawAbout();
  }

  // --- Go ------------------------------------------------------------------------------------------

  var saved = load();
  showSchemeNames = !!saved.names;
  wire();
  start(typeof saved.seed === 'number' ? saved.seed : (Math.random() * 0xffffffff) >>> 0);
}());

</script>
