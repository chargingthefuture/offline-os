<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<link rel="apple-touch-icon" href="../../shared/icons/icon-180.png">
<link rel="icon" href="../../shared/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/theme.css">
<style>
  .back{display:inline-block;color:var(--muted);text-decoration:none;font-size:13px;margin-bottom:4px;}
  .back:hover{color:var(--amber);}
  .scores{display:flex;gap:10px;}
  .score{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px;text-align:center;min-width:74px;}
  .score .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .score .v{font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums;}
  .wrap{position:relative;margin:16px 0;}
  canvas{width:100%;height:auto;display:block;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;touch-action:none;}
  .overlay{position:absolute;inset:0;background:rgba(22,23,27,.86);border-radius:12px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;}
  .overlay.hide{display:none;}
  .overlay .big{font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.04em;color:var(--amber);}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin-top:2px;}
</style>
</head>
<body>
  <a class="back" href="../../" id="backOS">&lsaquo; OS</a>
  <div class="header" style="margin-top:2px">
    <div><h1>Snake</h1><p class="sub">Swipe to steer</p></div>
    <div class="scores">
      <div class="score"><div class="k">Score</div><div class="v" id="score">0</div></div>
      <div class="score"><div class="k">Best</div><div class="v" id="best">0</div></div>
    </div>
  </div>
  <div class="wrap">
    <canvas id="cv" width="380" height="380"></canvas>
    <div class="overlay" id="overlay"><div class="big" id="ovtext">Snake</div>
      <button class="btn" style="width:auto;padding:14px 24px" onclick="start()">Play</button></div>
  </div>
  <div class="hint">Swipe or arrow keys. Eat the amber dots. Don't hit the walls or yourself.</div>

<script src="../../shared/storage.js"></script>
<script src="../../shared/pwa.js"></script>
<script>
registerPWA('sw.js');
(function(){var b=document.getElementById('backOS');if(b){var m=location.pathname.match(/^(.*?\/)apps\//);if(m)b.href=m[1];}})();

var SKEY='game-snake';
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var GRID=19, CELL=cv.width/GRID;
var snake, dir, ndir, food, score=0, best=0, timer=null, speed;

async function loadBest(){ try{var r=await window.storage.get(SKEY); if(r&&r.value) best=JSON.parse(r.value).best||0;}catch(e){} document.getElementById('best').textContent=best; }
async function saveBest(){ if(score>best){ best=score; document.getElementById('best').textContent=best; try{await window.storage.set(SKEY,JSON.stringify({best:best}));}catch(e){} } }

function placeFood(){ while(true){ var f={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)}; if(!snake.some(function(s){return s.x===f.x&&s.y===f.y;})){ food=f; return; } } }
function start(){
  snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}]; dir={x:1,y:0}; ndir=dir; score=0; speed=140;
  document.getElementById('score').textContent=0; document.getElementById('overlay').classList.add('hide');
  placeFood(); draw(); loop();
}
function loop(){ if(timer) clearInterval(timer); timer=setInterval(step,speed); }
function step(){
  dir=ndir;
  var h={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=GRID||h.y>=GRID||snake.some(function(s){return s.x===h.x&&s.y===h.y;})){ return gameOver(); }
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){ score+=10; document.getElementById('score').textContent=score; placeFood(); if(speed>70){speed-=4;loop();} }
  else snake.pop();
  draw();
}
function gameOver(){ clearInterval(timer); timer=null; saveBest(); document.getElementById('ovtext').textContent='Game over · '+score; document.getElementById('overlay').classList.remove('hide'); }
function draw(){
  ctx.fillStyle='#20222a'; ctx.fillRect(0,0,cv.width,cv.height);
  if(!snake||!food) return;
  ctx.fillStyle='#ffb000'; ctx.beginPath(); ctx.arc((food.x+.5)*CELL,(food.y+.5)*CELL,CELL*.32,0,7); ctx.fill();
  for(var i=0;i<snake.length;i++){ var s=snake[i]; ctx.fillStyle=i===0?'#e9e6df':'#4caf7d'; var pad=1.5; roundRect(s.x*CELL+pad,s.y*CELL+pad,CELL-2*pad,CELL-2*pad,4); }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.fill(); }

function setDir(x,y){ if((x&&dir.x)||(y&&dir.y)) return; ndir={x:x,y:y}; }
document.addEventListener('keydown',function(e){ var m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key]; if(m){e.preventDefault(); setDir(m[0],m[1]);} });
var sx=0,sy=0,tch=false;
cv.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;tch=true;},{passive:true});
cv.addEventListener('touchend',function(e){ if(!tch)return; tch=false; var t=e.changedTouches[0]; var dx=t.clientX-sx,dy=t.clientY-sy; if(Math.abs(dx)<16&&Math.abs(dy)<16)return; if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1); });

(async function(){ await loadBest(); draw(); })();
</script>
</body>
</html>
