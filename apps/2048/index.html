<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2048">
<link rel="apple-touch-icon" href="../../shared/icons/icon-180.png">
<link rel="icon" href="../../shared/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/theme.css">
<style>
  .back{display:inline-block;color:var(--muted);text-decoration:none;font-size:13px;margin-bottom:4px;}
  .back:hover{color:var(--amber);}
  .scores{display:flex;gap:10px;}
  .score{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px;text-align:center;min-width:74px;}
  .score .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .score .v{font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums;}
  .board{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:8px;margin:16px 0;touch-action:none;user-select:none;aspect-ratio:1;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;height:100%;}
  .cell{background:#20222a;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;font-size:clamp(20px,8vw,34px);color:#1a1300;}
  .t0{background:#20222a;color:transparent;}
  .t2{background:#3a3f4b;color:var(--text);} .t4{background:#4a505e;color:var(--text);}
  .t8{background:#e0a04a;} .t16{background:#e08a3c;} .t32{background:#dd6f4a;}
  .t64{background:#d9534f;} .t128{background:#ffc14d;font-size:clamp(18px,7vw,30px);}
  .t256{background:#ffb52e;} .t512{background:#ffab00;} .t1024{background:#ffa000;font-size:clamp(15px,6vw,24px);}
  .t2048{background:#ff8f00;} .tbig{background:#1a1300;color:var(--amber);font-size:clamp(15px,6vw,24px);}
  .pop{animation:pop .15s ease;}
  @keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
  .row{display:flex;gap:10px;}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin-top:2px;}
  .overlay{position:absolute;inset:0;background:rgba(22,23,27,.86);border-radius:12px;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;}
  .overlay.show{display:flex;}
  .overlay .big{font-family:'Barlow Semi Condensed','Inter',sans-serif;font-weight:700;font-size:34px;
    text-transform:uppercase;letter-spacing:.04em;color:var(--amber);}
</style>
</head>
<body>
  <a class="back" href="../../" id="backOS">&lsaquo; OS</a>
  <div class="header" style="margin-top:2px">
    <div><h1>2048</h1><p class="sub">Swipe to combine tiles</p></div>
    <div class="scores">
      <div class="score"><div class="k">Score</div><div class="v" id="score">0</div></div>
      <div class="score"><div class="k">Best</div><div class="v" id="best">0</div></div>
    </div>
  </div>
  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="overlay" id="overlay"><div class="big" id="ovtext">Game over</div>
      <button class="btn" style="width:auto;padding:14px 24px" onclick="newGame()">New game</button></div>
  </div>
  <div class="row"><button class="btn" onclick="newGame()">New game</button></div>
  <div class="hint">Swipe the board (or use arrow keys). Reach 2048.</div>

<script src="../../shared/storage.js"></script>
<script src="../../shared/pwa.js"></script>
<script>
registerPWA('sw.js');
(function(){var b=document.getElementById('backOS');if(b){var m=location.pathname.match(/^(.*?\/)apps\//);if(m)b.href=m[1];}})();

var SKEY='game-2048', N=4;
var grid=[], score=0, best=0, over=false, won=false, spawnedAt=null;

async function loadBest(){ try{var r=await window.storage.get(SKEY); if(r&&r.value) best=JSON.parse(r.value).best||0;}catch(e){} document.getElementById('best').textContent=best; }
async function saveBest(){ if(score>best){ best=score; document.getElementById('best').textContent=best; try{await window.storage.set(SKEY,JSON.stringify({best:best}));}catch(e){} } }

function empty(){ var a=[]; for(var r=0;r<N;r++)for(var c=0;c<N;c++) if(!grid[r][c]) a.push([r,c]); return a; }
function spawn(){ var e=empty(); if(!e.length) return; var p=e[Math.floor(Math.random()*e.length)]; grid[p[0]][p[1]]=Math.random()<0.9?2:4; spawnedAt=p[0]+'-'+p[1]; }
function newGame(){ grid=[]; for(var r=0;r<N;r++){grid.push([0,0,0,0]);} score=0; over=false; won=false; document.getElementById('overlay').classList.remove('show'); spawn(); spawn(); render(); }

function slideRow(row){ // move/merge left; returns {row,gain,moved}
  var a=row.filter(function(x){return x;}); var gain=0;
  for(var i=0;i<a.length-1;i++){ if(a[i]===a[i+1]){ a[i]*=2; gain+=a[i]; if(a[i]===2048) won=true; a.splice(i+1,1);} }
  while(a.length<N) a.push(0);
  var moved=a.some(function(x,i){return x!==row[i];});
  return {row:a,gain:gain,moved:moved};
}
function rotate(g){ var n=[]; for(var r=0;r<N;r++){n.push([]);for(var c=0;c<N;c++) n[r].push(g[N-1-c][r]);} return n; }
function move(dir){ // 0 left,1 up,2 right,3 down
  if(over) return;
  var g=grid, k=dir; for(var i=0;i<k;i++) g=rotate(g);
  var moved=false, gain=0, ng=[];
  for(var r=0;r<N;r++){ var s=slideRow(g[r]); ng.push(s.row); gain+=s.gain; if(s.moved) moved=true; }
  for(var j=0;j<(4-k)%4;j++) ng=rotate(ng);
  if(!moved){ return; }
  grid=ng; score+=gain; spawn(); render(); saveBest();
  if(!canMove()){ over=true; document.getElementById('ovtext').textContent='Game over'; document.getElementById('overlay').classList.add('show'); }
  else if(won){ won=false; document.getElementById('ovtext').textContent='2048! Keep going'; document.getElementById('overlay').classList.add('show'); setTimeout(function(){document.getElementById('overlay').classList.remove('show');},1200); }
}
function canMove(){ if(empty().length) return true;
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){ var v=grid[r][c]; if((c<N-1&&grid[r][c+1]===v)||(r<N-1&&grid[r+1][c]===v)) return true; } return false; }

function render(){
  document.getElementById('score').textContent=score;
  var g=document.getElementById('grid'); g.innerHTML='';
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var v=grid[r][c]; var d=document.createElement('div');
    var cls=v===0?'t0':(v>2048?'tbig':'t'+v);
    d.className='cell '+cls+((spawnedAt===r+'-'+c)?' pop':'');
    d.textContent=v||''; g.appendChild(d);
  }
  spawnedAt=null;
}

// input
document.addEventListener('keydown',function(e){ var k={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3}[e.key]; if(k!==undefined){e.preventDefault();move(k);} });
var sx=0,sy=0,touching=false;
var board=document.getElementById('board');
board.addEventListener('touchstart',function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; touching=true; },{passive:true});
board.addEventListener('touchend',function(e){ if(!touching) return; touching=false; var t=e.changedTouches[0]; var dx=t.clientX-sx, dy=t.clientY-sy; if(Math.abs(dx)<20&&Math.abs(dy)<20) return; if(Math.abs(dx)>Math.abs(dy)) move(dx>0?2:0); else move(dy>0?3:1); });

(async function(){ await loadBest(); newGame(); })();
</script>
</body>
</html>
